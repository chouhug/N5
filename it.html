*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{background:transparent}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--pat) center bottom/cover no-repeat}
[hidden]{display:none!important}
body{font-family:var(--font-ui);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.ja{font-family:var(--font-ja)}
[lang="ja"]{font-family:var(--font-ja)}
ruby{ruby-position:over;ruby-align:center}
rt{font-size:.5em;color:var(--muted);font-family:var(--font-ja);letter-spacing:-.02em;line-height:1.1;ruby-align:center;position:relative;z-index:1}
mark{background:var(--mark);color:var(--mark-ink);border-radius:0;padding:0;display:inline-block;line-height:1.12;vertical-align:baseline}
mark.ms{border-top-left-radius:4px;border-bottom-left-radius:4px;padding-left:.08em}
mark.me{border-top-right-radius:4px;border-bottom-right-radius:4px;padding-right:.08em}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 頂部 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:8px}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.brand b{font-family:var(--font-kana);font-weight:600;color:var(--pri);margin-right:2px}
.goal{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.goal span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pri);border-radius:6px;transition:width .3s}
.iconbtn{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;color:var(--pri);font-size:14px;font-weight:600}
.iconbtn[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.iconbtn svg{width:20px;height:20px}

/* 主內容與分頁 */
main{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 24px)}
main .wrap{padding-block:16px}
.tab{display:flex;flex-direction:column;gap:16px}
.tab[hidden]{display:none!important}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabbar button{height:var(--tabh);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
.tabbar button .g{font-size:20px;line-height:1;font-family:var(--font-kana);font-weight:600;height:22px;display:flex;align-items:center}
.tabbar button .g svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--pri)}
.tabbar button[aria-current="page"] .g{background:var(--pri-soft);border-radius:999px;padding:0 14px}
@media (pointer:coarse){
  body.typing .top, body.typing .tabbar{display:none}
  body.typing main{padding-bottom:70vh}
}

/* 共用元件 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.segrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;white-space:nowrap;min-height:40px;border:0;border-radius:9px;background:none;color:var(--muted);font-weight:600;font-size:14px;padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--pri);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.possel{flex:none;min-height:38px;border-radius:999px;padding:0 10px;font-size:14px;color:var(--fg)}
.possel.on{border-color:var(--pri);color:var(--pri);font-weight:600}
.chip{flex:none;min-height:38px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:0 13px;font-size:14px;color:var(--fg);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.85;margin-left:4px}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--pri);background:var(--surface);color:var(--pri);font-weight:600;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.solid{background:var(--pri);color:var(--pri-ink)}
.btn.block{width:100%}
.btn.quiet{border-color:var(--line);color:var(--fg)}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.5;cursor:default}
.play{min-height:44px;min-width:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--pri);display:inline-flex;align-items:center;gap:6px;padding:0 14px;font-size:14px;font-weight:600}
.play svg{width:18px;height:18px}
.label{font-size:13px;color:var(--muted);letter-spacing:.04em}
.meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.pos{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-family:var(--font-ui)}
.romaji{font-family:var(--font-ui);color:var(--muted);font-size:14px;letter-spacing:.02em}
.hide-romaji .romaji{display:none}
.empty{text-align:center;padding:28px 12px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;color:var(--muted);max-width:32ch}
select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;max-width:100%}

/* 題目 */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.prompt{text-align:center;padding:18px 0 8px;display:flex;flex-direction:column;gap:6px;align-items:center}
.prompt .big{font-family:var(--font-ja);font-size:clamp(32px,9vw,44px);font-weight:500;line-height:1.5}
.prompt .big rt{font-size:.42em}
.prompt .kana{font-family:var(--font-kana);font-size:clamp(64px,22vw,96px);line-height:1.1;font-weight:600}
.prompt .zh{font-size:26px;font-weight:700}
.opts{display:grid;gap:12px;margin-top:12px}
.opt{min-height:56px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);display:flex;align-items:center;gap:12px;padding:8px 14px;text-align:left;width:100%}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--surface2);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.opt .t{flex:1;min-width:0;font-size:18px}
.opt .t.ja{font-size:22px}
.opt .t.kanab{font-family:var(--font-kana);font-size:30px;font-weight:600}
.opt .t rt{font-size:.5em}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .k{background:var(--ng);color:var(--surface)}
.verdict{font-weight:700;display:flex;align-items:center;gap:6px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.verdict svg{width:20px;height:20px}
.example{border-top:1px dashed var(--line);margin-top:6px;padding-top:16px;display:flex;flex-direction:column;gap:10px}
.sent{font-family:var(--font-ja);font-size:21px;line-height:2.15}
.sent rt{font-size:.5em}
.zhline{color:var(--fg)}
.afterbox{display:flex;flex-direction:column;gap:14px;margin-top:16px}

/* 填空 */
.blank{display:inline-block;min-width:3.5em;border-bottom:2.5px solid var(--pri);color:var(--pri);padding:0 .2em;text-align:center;line-height:1.3}
.blank.ok{border-color:var(--ok);color:var(--ok)} .blank.ng{border-color:var(--ng);color:var(--ng)}
.hint{display:flex;flex-direction:column;gap:2px;background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:15px}
.hint b{font-family:var(--font-ja);font-weight:700}
.answerrow{display:flex;gap:8px}
.answerrow input{flex:1;min-width:0;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:20px;font-family:var(--font-ja)}
.answerrow input:focus{border-color:var(--pri);outline:none}
.preview{font-size:14px;color:var(--muted);min-height:1.4em}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* 字卡 */
.fc{display:flex;flex-direction:column;gap:14px}
.fc .word{font-family:var(--font-ja);font-size:clamp(34px,10vw,44px);font-weight:500;line-height:1.45;text-align:center}
.fc .word rt{font-size:.4em}
.fc .sub{text-align:center;display:flex;flex-direction:column;gap:2px}
.fc .zh{font-size:22px;font-weight:700;text-align:center}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;border-radius:999px;padding:2px 10px;border:1px solid var(--ng);color:var(--ng)}
.fcbtns{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.fcbtns .wide{grid-column:1/-1}

/* 五十音表 */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.legend .l2{background:var(--pri);border-color:var(--pri)} .legend .l1{background:var(--pri-soft);border-color:var(--pri-mid)}
.ktable{display:grid;gap:5px}
.ktable.c5{grid-template-columns:repeat(5,1fr)}
.ktable.c3{grid-template-columns:repeat(3,1fr)}
.kc{min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px 2px}
.kc .kk{font-family:var(--font-kana);font-size:24px;font-weight:600;line-height:1.2}
.ktable.c3 .kc .kk{font-size:24px}
.kc .rr{font-size:12px;color:var(--muted)}
.kc.s1{background:var(--pri-soft);border-color:var(--pri-mid)}
.kc.s2{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.kc.s2 .rr{color:var(--pri-ink);opacity:.9}
.kc.sel{outline:3px solid var(--fg);outline-offset:1px}
.kgap{visibility:hidden}
.ksec h3{margin:6px 0 8px;font-size:15px}
.kdetail{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.sq{width:104px;height:104px;border:1.5px solid var(--ng);position:relative;display:flex;align-items:center;justify-content:center;font-family:var(--font-kana);font-size:72px;font-weight:600;color:var(--fg);background:var(--surface)}
.sq::before,.sq::after{content:"";position:absolute;border:0 dashed var(--ng);opacity:.45}
.sq::before{left:50%;top:0;bottom:0;border-left-width:1px}
.sq::after{top:50%;left:0;right:0;border-top-width:1px}
.sq span{position:relative;z-index:1}
.sq.small{width:72px;height:72px;font-size:46px}
.kinfo{display:flex;flex-direction:column;gap:6px;min-width:0}
.kinfo .rom{font-size:24px;font-weight:700}
.notes{display:flex;flex-direction:column;gap:16px;padding:0 14px 14px}
.note h3{margin:0 0 6px;font-size:16px}
.note p{margin:0 0 8px}
.exlist{display:grid;gap:8px}
.exitem{display:flex;align-items:center;gap:10px;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px}
.exitem .ja{font-size:20px}

/* 單字庫 */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.stat b{font-size:20px;font-variant-numeric:tabular-nums;line-height:1.25}
.stat span{font-size:11px;color:var(--muted);white-space:nowrap}
.search input{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:17px}
.search input:focus{border-color:var(--pri);outline:none}
.results{display:flex;flex-direction:column;gap:8px}
.res{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.res .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.res .w{font-family:var(--font-ja);font-size:24px}
.res .w rt{font-size:.45em}
.res .sent{font-size:18px}
.st{font-size:12px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--muted)}
.st.queued{border-color:var(--pri-mid);color:var(--pri)} .st.learned{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.entry{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.entry button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 12px;text-align:left;color:var(--fg);font-size:14px}
.entry button b{color:var(--pri);font-variant-numeric:tabular-nums}
.entry button.zero b{color:var(--muted);font-weight:400}
details.lst{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.lst summary{min-height:54px;gap:8px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;cursor:pointer;list-style:none;font-weight:600}
details.lst summary::-webkit-details-marker{display:none}
details.lst summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:10px}
details.lst[open] summary::after{transform:rotate(-135deg)}
details.lst summary .n{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.lrows{display:flex;flex-direction:column;border-top:1px solid var(--line);max-height:420px;overflow-y:auto}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .w{font-family:var(--font-ja);font-size:19px;flex:none}
.lrow .w rt{font-size:.5em}
.lrow .z{flex:1;min-width:0;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .d{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.lrow button{flex:none;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--pri);font-size:13px;padding:0 10px}
.sec-title{font-size:15px;font-weight:700;margin:6px 0 0}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:var(--pri)}
.warn{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:14px}
textarea{width:100%;min-height:110px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync{margin-left:auto;font-weight:400}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)}

.qh-l{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-width:0;flex:1}
.fc .qhead{flex-wrap:nowrap;align-items:flex-start}
.gbtn{flex:none;min-height:40px;border-radius:999px;border:1px solid var(--pri);background:var(--surface);color:var(--pri);font-weight:600;font-size:14px;padding:0 14px;display:inline-flex;align-items:center;gap:6px}
.gbtn b{background:var(--pri);color:var(--pri-ink);border-radius:999px;min-width:20px;height:20px;padding:0 6px;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.gbtn[aria-expanded="true"]{background:var(--pri-soft)}
.gpanel{background:var(--surface2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:14px}
.gp-title{font-size:13px;color:var(--muted);letter-spacing:.04em}
.gp-item{display:flex;flex-direction:column;gap:4px}
.gp-item + .gp-item{border-top:1px solid var(--line);padding-top:12px}
.gp-h{display:flex;align-items:center;gap:8px;font-size:16px}
.lv{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted)}
.gp-s{color:var(--fg);font-size:16px}
.gpanel p{margin:0}
/* 點單字 */
.tk{cursor:pointer;border-radius:4px;-webkit-tap-highlight-color:transparent;text-decoration:none;margin:0 1px;padding-bottom:2px;background-image:radial-gradient(circle,var(--muted) .9px,transparent 1.1px);background-size:4px 3px;background-repeat:repeat-x;background-position:0 100%;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tk.on{background:var(--pri-soft);text-decoration-color:var(--pri)}
.tk:focus-visible{outline:2px solid var(--pri)}
.gloss{position:fixed;z-index:35;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 10px);max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;box-shadow:0 10px 30px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:8px}
.gl-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.gl-word{font-family:var(--font-ja);font-size:30px;line-height:1.5}
.gl-word rt{font-size:.45em}
.gl-zh{font-size:18px;font-weight:600}
.gl-x{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center}
.gl-x svg{width:18px;height:18px}
.posbtn{display:inline-flex;align-items:center;gap:4px;min-height:32px;font-size:12px;color:var(--pri);border:1px solid var(--pri-mid);background:var(--surface);border-radius:8px;padding:0 8px;font-family:var(--font-ui)}
.posbtn span{font-size:15px;line-height:1}
.gloss.tall{max-height:min(72vh,640px)}
.gl-scroll{overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:0;margin:0 -4px;padding:0 4px}
.fm-type{display:flex;align-items:center;gap:8px;font-size:16px}
.fm-desc{margin:0;line-height:1.7}
.fm-note{margin:0;background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:14px}
.fm-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gl-scroll > *, .fm-row{flex-shrink:0}
.fm-item{border-bottom:1px solid var(--line)}
.fm-item:last-child{border-bottom:0}
.fm-row{display:flex;align-items:stretch;background:var(--surface)}
.fm-tg{flex:1;min-width:0;display:grid;grid-template-columns:5.5em 1fr;gap:2px 10px;align-items:center;text-align:left;border:0;background:none;padding:10px 4px 10px 12px;color:var(--fg);min-height:52px}
.fm-tg[aria-expanded="true"]{background:var(--pri-soft)}
.fm-tg:active{background:var(--pri-soft)}
.fm-say{flex:none;width:48px;border:0;border-left:1px solid var(--line);background:none;color:var(--pri);display:flex;align-items:center;justify-content:center}
.fm-say svg{width:18px;height:18px}
.fm-l{font-size:13px;color:var(--muted);grid-row:span 2}
.fm-s{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:19px;min-width:0}
.fm-s small{font-size:12px;color:var(--muted)}
.fm-n{font-size:13px;color:var(--muted)}
.fm-ex{background:var(--surface2);padding:12px;display:flex;flex-direction:column;gap:12px}
.fx-h{font-size:12px;color:var(--muted);letter-spacing:.04em}
.fx{display:flex;flex-direction:column;gap:4px}
.fx + .fx{border-top:1px dashed var(--line);padding-top:10px}
.fx-s{font-size:19px;line-height:2.1}
.fx-zh{font-size:14px}
.fx .play{min-height:36px;padding:0 10px;font-size:13px}
.gl-back{flex:none;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--pri);font-weight:600;padding:0 10px;align-self:center}
.gl-top .gl-word{flex:1;min-width:0}
.peek{margin-top:6px;background:var(--surface);border:1px solid var(--pri-mid);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pk-top{display:flex;align-items:center;gap:10px}
.pk-w{font-family:var(--font-ja);font-size:22px;line-height:1.5}
.pk-w rt{font-size:.45em}
.pk-x{margin-left:auto;flex:none;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center}
.pk-x svg{width:14px;height:14px}
.peek .play,.peek .btn{min-height:40px}
/* 精簡控制列 */
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.pill{flex:1 1 0;min-width:0;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:14px;font-weight:600;padding:0 28px 0 12px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
.pill.on{border-color:var(--pri);color:var(--pri)}
.qhead .qprog{flex:1;height:5px;border-radius:5px;background:var(--surface2);overflow:hidden;min-width:60px}
.qhead .qprog i{display:block;height:100%;background:var(--pri)}
.word-row{display:flex;align-items:center;justify-content:center;gap:10px}
.ex-row{display:flex;align-items:flex-start;gap:8px}
.ex-row .sent{flex:1;min-width:0}
.iplay{flex:none;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;margin-top:4px}
.iplay svg{width:18px;height:18px}
.setgrp{display:flex;flex-direction:column;gap:18px;padding:0 14px 16px}
.setgrp section{display:flex;flex-direction:column;gap:8px}
.setgrp section + section{border-top:1px solid var(--line);padding-top:14px}
.setgrp h4{margin:0;font-size:14px}
.furibtn ruby{font-family:var(--font-ja);font-size:17px;font-weight:600;line-height:1}
.furibtn rt{font-size:9px;color:inherit;visibility:visible!important}
.iconbtn.furibtn[aria-pressed="false"]{color:var(--muted)}
.iconbtn.furibtn[aria-pressed="false"] rt{text-decoration:line-through}
body.hide-furi rt{visibility:hidden}
body.hide-furi #gloss rt,body.hide-furi .furibtn rt{visibility:visible}
.authcard{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--pri-soft);border:1px solid var(--pri-mid);border-radius:14px;padding:12px 14px}
.authcard b{font-size:15px}
.gbtn-signin{gap:8px;white-space:nowrap;flex:none}
.gbtn-signin svg{background:#fff;border-radius:50%;padding:2px;width:22px;height:22px}
.en{color:var(--muted);font-weight:400;font-size:.88em}
/* 提示 */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.toast.goal{background:var(--pri);color:var(--pri-ink);font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.brand .full{display:none}}

/* ===== 按鈕：鍵帽質感（底部有一條較深的邊，按下去會往下沉） ===== */
.btn,.opt,.chip,.pill,.play,.iconbtn,.kc,.entry button,.seg{transition:transform .08s ease,box-shadow .08s ease,background-color .15s,border-color .15s}
.btn{box-shadow:0 3px 0 var(--pri-mid)}
.btn.solid{background:linear-gradient(180deg,color-mix(in srgb,var(--pri) 86%,#fff) 0%,var(--pri) 100%);border-color:var(--pri-deep);box-shadow:0 3px 0 var(--pri-deep),0 6px 14px -6px color-mix(in srgb,var(--pri) 55%,transparent)}
.btn.quiet{box-shadow:0 3px 0 var(--edge)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--pri-mid)}
.btn.solid:active:not(:disabled){box-shadow:0 1px 0 var(--pri-deep)}
.btn.quiet:active:not(:disabled){box-shadow:0 1px 0 var(--edge)}
.btn:disabled{box-shadow:none}
.opt{box-shadow:0 3px 0 var(--edge)}
.opt .k{background:var(--pri-soft);color:var(--pri)}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.opt.right{box-shadow:0 3px 0 var(--ok-deep)}
.opt.wrong{box-shadow:0 3px 0 var(--ng-deep)}
.chip,.pill,.play,.iconbtn,.kc,.entry button{box-shadow:0 2px 0 var(--edge)}
.chip[aria-pressed="true"],.iconbtn[aria-pressed="true"]{box-shadow:0 2px 0 var(--pri-deep)}
.kc.s2{box-shadow:0 2px 0 var(--pri-deep)}
.chip:active,.play:active,.iconbtn:active,.kc:active,.entry button:active{transform:translateY(2px);box-shadow:0 0 0 var(--edge)}
.entry button b{background:var(--surface);border-radius:999px;padding:0 9px;min-width:28px;text-align:center}
.entry button.zero b{background:none}
.seg button[aria-pressed="true"]{box-shadow:0 2px 0 var(--edge)}
@media (prefers-reduced-motion: reduce){.btn,.opt,.chip,.pill,.play,.iconbtn,.kc,.entry button{transition:none}.btn:active,.opt:active,.chip:active,.play:active,.iconbtn:active,.kc:active,.entry button:active{transform:none}}

/* ===== 按鈕配色：跟卡片、背景分開的填色（淺色、深色模式都有） ===== */
.btn.quiet,.pill,.iconbtn,.chip,.entry button,.kc,.opt{background-color:var(--btn);border-color:var(--btn-edge);color:var(--btn-ink);box-shadow:0 3px 0 var(--btn-edge)}
.iconbtn{color:var(--pri)}
.btn.quiet:active:not(:disabled),.opt:active:not(:disabled){box-shadow:0 1px 0 var(--btn-edge)}
.chip:active,.iconbtn:active,.kc:active,.entry button:active,.pill:active{box-shadow:0 1px 0 var(--btn-edge)}
.opt .k{background:var(--surface);color:var(--pri)}
.opt.right{background-color:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background-color:var(--ng-soft);border-color:var(--ng)}
.opt:disabled:not(.right):not(.wrong){opacity:.75}
.chip[aria-pressed="true"],.iconbtn[aria-pressed="true"]{background-color:var(--pri);border-color:var(--pri-deep);color:var(--pri-ink)}
.kc.s1{background-color:var(--pri-soft);border-color:var(--pri-mid);box-shadow:0 3px 0 var(--pri-mid)}
.kc.s2{background-color:var(--pri);border-color:var(--pri-deep);color:var(--pri-ink);box-shadow:0 3px 0 var(--pri-deep)}
.pill.on{border-color:var(--pri);color:var(--pri)}
.seg{background:var(--btn)}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);box-shadow:0 2px 0 var(--pri-deep)}
.play{background:var(--pri-soft);border-color:var(--pri-mid);color:var(--pri);box-shadow:0 3px 0 var(--pri-mid)}
.play:active{box-shadow:0 1px 0 var(--pri-mid)}
/* 五十音圖例：還沒學＝按鈕底色 */
.legend i{background:var(--btn);border-color:var(--btn-edge)}
/* 稍後再看：琥珀色 */
.btn[data-a="later"]{background:var(--amb);border-color:var(--amb-edge);color:var(--amb-ink);box-shadow:0 3px 0 var(--amb-edge)}
.btn[data-a="later"]:active{box-shadow:0 1px 0 var(--amb-edge)}
/* 文法：紫色 */
.gbtn{background:var(--vio);border-color:var(--vio-edge);color:var(--vio-ink);box-shadow:0 3px 0 var(--vio-edge);transition:transform .08s,box-shadow .08s}
.gbtn b{background:var(--vio-ink);color:var(--vio)}
.gbtn[aria-expanded="true"]{background:var(--vio-ink);color:var(--vio)}
.gbtn[aria-expanded="true"] b{background:var(--vio);color:var(--vio-ink)}
.gbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--vio-edge)}
/* 詞性：青綠色 */
.posbtn{background:var(--tea);border-color:var(--tea-edge);color:var(--tea-ink);box-shadow:0 2px 0 var(--tea-edge);transition:transform .08s,box-shadow .08s}
.posbtn:active{transform:translateY(2px);box-shadow:0 0 0 var(--tea-edge)}
@media (prefers-reduced-motion: reduce){.gbtn,.posbtn{transition:none}.gbtn:active,.posbtn:active{transform:none}}

/* ===== 滑動開關（平假名／片假名、五十音表／練習） ===== */
.seg{position:relative;isolation:isolate;gap:0;padding:4px;border-radius:10px;background:var(--btn);box-shadow:var(--track),inset 0 0 0 1px var(--btn-edge)}
.seg::before{content:"";position:absolute;z-index:0;top:4px;bottom:6px;left:4px;width:calc((100% - 8px) / var(--n, 2));transform:translateX(calc(var(--i, 0) * 100%));border-radius:7px;background:linear-gradient(180deg,color-mix(in srgb,var(--pri) 82%,#fff),var(--pri));box-shadow:0 3px 0 var(--pri-deep),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .24s cubic-bezier(.3,.8,.3,1)}
.seg.seg-noanim::before{transition:none}
.seg button,.seg button[aria-pressed="true"]{position:relative;z-index:1;background:none;box-shadow:none;border-radius:7px;min-height:42px;margin-bottom:2px;transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--pri-ink)}
/* ===== 五十音格子：立體鍵帽 ===== */
.ktable{row-gap:10px}
.kc{border-radius:12px;background-image:linear-gradient(180deg,var(--hi-grad) 0%,transparent 65%);box-shadow:inset 0 1px 0 var(--hi),0 4px 0 var(--btn-edge),0 8px 12px -6px var(--drop)}
.kc .kk{text-shadow:var(--kk-shadow)}
.kc.s1{box-shadow:inset 0 1px 0 var(--hi),0 4px 0 var(--pri-mid),0 8px 12px -6px var(--drop)}
.kc.s2{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 0 var(--pri-deep),0 8px 12px -6px var(--drop)}
.kc.s2 .kk{text-shadow:0 2px 0 rgba(0,0,0,.25)}
.kc:active{transform:translateY(3px);box-shadow:inset 0 1px 0 var(--hi),0 1px 0 var(--btn-edge),0 2px 4px -2px var(--drop)}
@media (prefers-reduced-motion: reduce){.seg::before{transition:none}.kc:active{transform:none}}

/* ===== 實心藍：深色模式改用飽和的藍＋白字，不用淺粉藍 ===== */
.btn.solid{background:linear-gradient(180deg,color-mix(in srgb,var(--fill) 85%,#fff),var(--fill));border-color:var(--fill-deep);color:var(--fill-ink);box-shadow:0 3px 0 var(--fill-deep),0 6px 14px -6px color-mix(in srgb,var(--fill) 55%,transparent)}
.btn.solid:active:not(:disabled){box-shadow:0 1px 0 var(--fill-deep)}
.seg::before{background:linear-gradient(180deg,color-mix(in srgb,var(--fill) 85%,#fff),var(--fill));box-shadow:0 3px 0 var(--fill-deep),inset 0 1px 0 rgba(255,255,255,.25)}
.seg button[aria-pressed="true"]{color:var(--fill-ink)}
.chip[aria-pressed="true"],.iconbtn[aria-pressed="true"]{background-color:var(--fill);border-color:var(--fill-deep);color:var(--fill-ink);box-shadow:0 3px 0 var(--fill-deep)}
.kc.s2{background-color:var(--fill);border-color:var(--fill-deep);color:var(--fill-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 0 var(--fill-deep),0 8px 12px -6px var(--drop)}
.kc.s2 .rr{color:var(--fill-ink)}
.legend .l2{background:var(--fill);border-color:var(--fill-deep)}
/* 已經會了：綠色 */
.btn.known{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);box-shadow:0 3px 0 var(--ok-deep)}
.btn.known:active{box-shadow:0 1px 0 var(--ok-deep)}

/* 已經會了：中等亮度的綠，實心白字 */
.btn.known{background:linear-gradient(180deg,color-mix(in srgb,var(--go) 88%,#fff),var(--go));border-color:var(--go-deep);color:var(--go-ink);box-shadow:0 3px 0 var(--go-deep)}
.btn.known:active{box-shadow:0 1px 0 var(--go-deep)}
/* ===== 五十音格子：霧面紙卡（取代亮面塑膠感） ===== */
.kc{border-radius:8px;background-color:var(--tile);background-image:var(--grain);border:1px solid var(--tile-line);color:var(--tile-ink);box-shadow:0 2px 0 var(--tile-edge),0 3px 6px -4px var(--drop)}
.kc .kk{text-shadow:none}
.kc .rr{color:var(--tile-sub)}
.kc.s1{background-color:var(--pri-soft);border-color:var(--pri-mid);box-shadow:0 2px 0 var(--pri-mid),0 3px 6px -4px var(--drop)}
.kc.s1 .rr{color:var(--pri)}
.kc.s2{background-color:var(--fill);border-color:var(--fill-deep);color:var(--fill-ink);box-shadow:0 2px 0 var(--fill-deep),0 3px 6px -4px var(--drop)}
.kc.s2 .kk{text-shadow:none}
.kc:active{transform:translateY(2px);box-shadow:0 0 0 var(--tile-edge)}
.legend i{background:var(--tile);border-color:var(--tile-line)}
.legend .l1{background:var(--pri-soft);border-color:var(--pri-mid)}
.legend .l2{background:var(--fill);border-color:var(--fill-deep)}

/* 黃色標記跨好幾個詞時連在一起，不留空隙 */
.tk:has(mark){margin:0}
/* ===== 文法區 ===== */
.g-txt{font-family:var(--font-ja);font-weight:700;font-size:20px;line-height:1}
.gr-search{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
.gr-group{display:flex;flex-direction:column;gap:8px}
.gr-group h3{margin:4px 2px 0;font-size:14px;color:var(--muted);font-weight:600}
.gr-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;text-align:left;width:100%;min-height:60px;padding:10px 14px;border-radius:12px;border:1px solid var(--btn-edge);background:var(--btn);color:var(--btn-ink);box-shadow:0 3px 0 var(--btn-edge);transition:transform .08s,box-shadow .08s}
.gr-row:active{transform:translateY(2px);box-shadow:0 1px 0 var(--btn-edge)}
.gr-row b{font-size:16px}
.gr-row .gd{grid-column:1;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr-row .gn{grid-row:1/3;grid-column:2;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.gr-row .gn span{background:var(--surface);border-radius:999px;padding:1px 9px;font-variant-numeric:tabular-nums;color:var(--pri);font-weight:600}
.gr-back{align-self:flex-start;min-height:40px;padding:0 14px 0 10px;border-radius:999px;border:1px solid var(--btn-edge);background:var(--btn);color:var(--pri);font-weight:600;box-shadow:0 2px 0 var(--btn-edge)}
.gr-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gr-head h2{margin:0;font-size:22px}
.gr-head .lv{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.gr-desc{font-size:16px;line-height:1.7;margin:10px 0 0}
.gr-exs{display:flex;flex-direction:column;gap:0}
.gr-ex{padding:14px 0;border-top:1px dashed var(--line)}
.gr-ex:first-child{border-top:0;padding-top:4px}
.gr-ex .from{font-size:12px;color:var(--muted);margin-top:4px}
.gr-more{width:100%}
.gp-more{margin-top:6px;min-height:36px;font-size:13px;padding:0 12px;border-radius:999px;border:1px solid var(--vio-edge);background:var(--vio);color:var(--vio-ink);font-weight:600}

/* ===== 詞性變化規則 ===== */
.rc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rc-tile{grid-template-columns:1fr;min-height:64px;text-align:center;justify-items:center;padding:8px 6px;background:var(--tea);border-color:var(--tea-edge);color:var(--tea-ink);box-shadow:0 3px 0 var(--tea-edge)}
.rc-tile:active{box-shadow:0 1px 0 var(--tea-edge)}
.rc-tile b{font-size:15px}
.rc-tile .gd{grid-column:auto;color:inherit;opacity:.8;font-size:12px}
.rc-list,.rc-te{display:flex;flex-direction:column}
.rc-row{padding:12px 0;border-top:1px dashed var(--line)}
.rc-row:first-child{border-top:0;padding-top:6px}
.rc-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rc-h b{font-size:16px}
.rc-rule{margin-top:2px;font-size:15px}
.rc-exs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rc-chip{display:inline-flex;flex-direction:column;align-items:flex-start;background:var(--btn);border:1px solid var(--btn-edge);border-radius:8px;padding:4px 10px;font-family:var(--font-ja);font-size:16px;line-height:1.3}
.rc-chip .rc-r{font-size:11px;color:var(--muted)}
.rc-words{display:flex;flex-wrap:wrap;gap:6px}
.rc-w{min-height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--btn-edge);background:var(--btn);color:var(--btn-ink);font-family:var(--font-ja);font-size:16px;box-shadow:0 2px 0 var(--btn-edge)}
.rc-w:active{transform:translateY(2px);box-shadow:0 0 0 var(--btn-edge)}

/* ===== 按鈕外框（試用） ===== */
.btn,.opt,.chip,.pill,.play,.iconbtn,.kc,.entry button,.gr-row,.gr-back,.rc-w,.gbtn,.posbtn,.seg,.iplay{border-width:2px;border-style:solid}
.btn.quiet,.opt,.chip,.pill,.iconbtn,.entry button,.gr-row,.gr-back,.rc-w,.seg,.kc{border-color:var(--frame)}
.btn.solid,.chip[aria-pressed="true"],.iconbtn[aria-pressed="true"],.kc.s2{border-color:var(--fill-deep)}
.btn.known{border-color:var(--go-deep)}
.play,.iplay,.kc.s1{border-color:var(--pri-mid)}
.gbtn{border-color:color-mix(in srgb,var(--vio-ink) 45%,var(--vio-edge))}
.posbtn,.rc-tile{border-color:color-mix(in srgb,var(--tea-ink) 40%,var(--tea-edge))}
.opt.right{border-color:var(--ok)}
.opt.wrong{border-color:var(--ng)}
.pill.on{border-color:var(--pri)}

/* 單選選項：沒選的時候接近卡片底色，不要看起來像被點過 */
.opt{background-color:var(--opt)}
.opt .k{background:var(--btn);color:var(--pri)}
.opt:hover:not(:disabled){border-color:var(--pri-mid)}
.opt.right{background-color:var(--ok-soft)}
.opt.wrong{background-color:var(--ng-soft)}

/* 選項稍微緊湊一點，答完後「下一題」比較容易出現在畫面內 */
.opts{gap:10px}
.opt{min-height:52px;padding-top:6px;padding-bottom:6px}

/* ===== 點綴色：底色維持中性，用彩色標籤和外框增加變化 ===== */
.opts .opt{border-color:var(--frame)}
.opts .opt .k{background:var(--pri-soft);color:var(--pri)}
.opts .opt:hover:not(:disabled){border-color:var(--pri)}
.opts .opt.right{border-color:var(--ok)}
.opts .opt.wrong{border-color:var(--ng)}
.opts .opt.right .k{background:var(--ok);color:var(--surface)}
.opts .opt.wrong .k{background:var(--ng);color:var(--surface)}
.pill{border-color:color-mix(in srgb,var(--pri) 40%,var(--frame))}
.entry button[data-go^="mc"]{border-color:color-mix(in srgb,var(--c3-ink) 45%,var(--frame))}
.entry button[data-go^="mc"] b{color:var(--c3-ink)}
.entry button[data-go^="fill"]{border-color:color-mix(in srgb,var(--c2-ink) 45%,var(--frame))}
.entry button[data-go^="fill"] b{color:var(--c2-ink)}
.entry button[data-go^="card"]{border-color:color-mix(in srgb,var(--c4-ink) 45%,var(--frame))}
.entry button[data-go^="card"] b{color:var(--c4-ink)}

/* ===== 自訂下拉選單 ===== */
.pw{flex:1 1 0;min-width:0;display:flex;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pw>.pill{flex:1;width:100%;pointer-events:none}
.pw:active>.pill{transform:translateY(2px);box-shadow:0 1px 0 var(--btn-edge)}
.pk-back{position:fixed;inset:0;z-index:60;background:rgba(5,8,14,.45);opacity:0;transition:opacity .18s}
.pk-back.in{opacity:1}
.pk{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:560px;margin:0 auto;max-height:72vh;display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--frame);border-bottom:0;border-radius:18px 18px 0 0;padding:6px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.25);transform:translateY(100%);transition:transform .2s cubic-bezier(.3,.8,.3,1)}
.pk.in{transform:none}
.pk-grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 8px}
.pk-top{display:flex;align-items:center;justify-content:space-between;padding:0 2px 10px}
.pk-top b{font-size:17px}
.pk-x{width:40px;height:40px;border-radius:999px;border:0;background:var(--btn);color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.pk-x svg{width:18px;height:18px}
.pk-list{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px 2px 6px}
.pk-opt{display:flex;align-items:center;gap:10px;min-height:54px;padding:0 14px;border-radius:12px;border:2px solid var(--frame);background:var(--opt);color:var(--fg);font-size:16px;font-weight:600;text-align:left;box-shadow:0 3px 0 var(--btn-edge);transition:transform .08s,box-shadow .08s}
.pk-opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--btn-edge)}
.pk-opt .pk-n{flex:1;min-width:0}
.pk-opt .pk-c{min-width:36px;text-align:center;padding:2px 10px;border-radius:999px;background:var(--btn);color:var(--pri);font-variant-numeric:tabular-nums;font-size:14px}
.pk-opt .pk-ck{width:22px;display:inline-flex;justify-content:center;color:var(--fill-ink)}
.pk-opt .pk-ck svg{width:18px;height:18px}
.pk-opt.zero{color:var(--muted)}
.pk-opt.zero .pk-c{color:var(--muted)}
.pk-opt.on{background:var(--fill);border-color:var(--fill-deep);color:var(--fill-ink);box-shadow:0 3px 0 var(--fill-deep)}
.pk-opt.on .pk-c{background:rgba(255,255,255,.2);color:var(--fill-ink)}
@media (prefers-reduced-motion: reduce){.pk,.pk-back{transition:none}}

.sfx-try{display:flex;flex-wrap:wrap;gap:6px}
.sfx-try .chip{min-height:34px;font-size:13px;padding:0 10px}

/* 單字庫清單的標籤列：捲動範圍留在框內，兩側淡出提示可以滑 */
.lst-chips{margin:0 12px;padding:4px 2px 12px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 16px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 16px),transparent);scroll-padding:0 12px}
.lst-chips .chip:first-child{margin-left:6px}
.lst-chips .chip:last-child{margin-right:10px}

/* 漢字讀音、助詞填空 */
.read-q{font-size:56px;letter-spacing:.04em}
.psent{font-size:24px;line-height:2.1;text-align:center}
.pblank{display:inline-block;min-width:2.4em;text-align:center;color:var(--pri);font-weight:700;border-bottom:2px solid var(--pri);margin:0 2px}

/* 拗音：練字格改成兩格並排，小字寫在格子左下；格子裡的兩個字靠近一點 */
.sqs{display:flex;gap:0}
.sqs.two .sq{width:76px;height:76px;font-size:52px}
.sqs.two .sq + .sq{border-left-width:0}
.sq .sm{font-size:.62em;transform:translate(-18%,14%)}
.kc .kk.kk2{letter-spacing:-.14em;margin-right:-.14em;font-feature-settings:"palt"}

/* 聽寫 */
.dict-play{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0 12px}
.dict-big{width:84px;height:84px;border-radius:999px;border:2px solid var(--fill-deep);background:linear-gradient(180deg,color-mix(in srgb,var(--fill) 85%,#fff),var(--fill));color:var(--fill-ink);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--fill-deep);transition:transform .08s,box-shadow .08s}
.dict-big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--fill-deep)}
.dict-big svg{width:38px;height:38px}
.hint.dict-hint{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px}
.linkbtn{border:0;background:none;color:var(--pri);font-weight:600;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.dict-mean{text-align:center;font-size:18px;font-weight:600;margin-top:8px}
/* 首次使用導覽 */
.tour-ring{position:fixed;z-index:70;border-radius:14px;box-shadow:0 0 0 3px var(--fill),0 0 0 9999px rgba(5,8,14,.55);pointer-events:none;transition:all .25s ease}
.tour-ring.none{left:50%!important;top:40%!important;width:0!important;height:0!important;box-shadow:0 0 0 9999px rgba(5,8,14,.55)}
.tour-card{position:fixed;z-index:71;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));max-width:480px;margin:0 auto;background:var(--surface);border:2px solid var(--frame);border-radius:16px;padding:16px 16px 14px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px}
.tour-card h3{margin:0;font-size:18px}
.tour-card p{margin:0;color:var(--muted);font-size:15px}
.tour-card .tour-step{font-size:13px;color:var(--muted)}
.tour-card .row{display:flex;gap:8px;align-items:center}
.tour-card .row .btn{flex:1}
.tour-dots{display:flex;gap:6px;justify-content:center}
.tour-dots i{width:7px;height:7px;border-radius:9px;background:var(--line)}
.tour-dots i.on{background:var(--fill);width:18px}
.tour-lang{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tour-art{display:block;width:100%;height:auto;max-height:110px}

/* 義大利文頁：沿用日文 App 的樣式（建置時從 ../index.html 抽出），這裡只補義大利文需要的部分 */
:root{--font-ja:var(--font-ui);--font-kana:var(--font-ui)}
[lang="it"]{font-family:var(--font-ui)}
.brand b{font-family:var(--font-ui);font-weight:800}
.g-txt{font-family:var(--font-ui);font-weight:800}

/* 句子：義大利文不用振り仮名，行高縮小 */
.sent{font-family:var(--font-ui);font-size:20px;line-height:1.75}
.sent.sm{font-size:18px}
.tk{display:inline;border:0;background-color:transparent;color:inherit;font:inherit;padding:0 0 2px;margin:0 1px}
mark{display:inline;line-height:inherit;border-radius:4px;padding:0 .08em}
.prompt .big{font-family:var(--font-ui);font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.prompt .mid{font-size:22px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.opt .t{overflow-wrap:anywhere}
.fc .word{font-family:var(--font-ui);font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.fc .word .art{color:var(--muted);font-weight:500}
.fc .forms{text-align:center;color:var(--muted);font-size:15px}
.pos.m{color:var(--pri);border-color:var(--pri-mid)}
.pos.f{color:var(--ng);border-color:color-mix(in srgb,var(--ng) 45%,var(--line))}
.st.wr{border-color:var(--ng);color:var(--ng)}
.blank{min-width:3em}

/* 字母表：沿用五十音的紙卡格子 */
.kc .rr{font-size:11px}
.kc.fo{opacity:.85}

/* 規則頁的例字：小的播放鍵 */
.say-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.say-chips .play{min-height:38px;padding:0 12px}
.say-chips .play em{font-style:normal;font-weight:500;color:var(--muted);font-size:13px}

/* 文法說明裡的表格 */
.gbody{font-size:16px;line-height:1.7}
.gbody p{margin:8px 0}
.gbody ul{margin:8px 0;padding-left:20px}
.gbody i{font-style:normal;color:var(--pri);font-weight:600}
.gbody table{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0;table-layout:fixed}
.gbody th,.gbody td{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.gbody th{background:var(--surface2);font-weight:600}
.gbody table.wide{table-layout:auto;font-size:13px}
.gbody table.wide th,.gbody table.wide td{white-space:nowrap;padding:5px 4px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}

/* 變化表 */
table.t{width:100%;border-collapse:collapse;font-size:16px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle;overflow-wrap:anywhere}
table.t th{font-size:13px;color:var(--muted);font-weight:600}
table.t td.p{color:var(--muted);width:28%;font-size:14px}
table.t td.f{font-weight:600}
table.t td.a{width:44px;text-align:right}
table.t .iplay{width:36px;height:36px;margin:0}

/* 拉起式面板（點字看意思、單字詳細、字母）：外觀和下拉選單一樣 */
.sheet-body{overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:0 2px 6px;min-height:0}
.sheet-body .w1{font-size:28px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.an{padding:10px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.an:first-child{border-top:0}
.an .grow{flex:1;min-width:0}
.an .btn{min-height:40px;padding:0 12px;font-size:14px}
.rowx{display:flex;align-items:center;gap:10px}
.rowx .grow{flex:1;min-width:0}
.mean-big{font-size:20px;font-weight:700;margin:0}
.verdict.warn{color:var(--amb-ink)}
.hl-warn{background:var(--amb);border:1px solid var(--amb-edge);color:var(--amb-ink);border-radius:10px;padding:8px 12px;font-size:15px}
.zhs{color:var(--muted);font-size:15px}
.grow{flex:1;min-width:0}

<script>
/* 義大利文變化引擎：冠詞、名詞複數、形容詞配合、動詞變化、斷詞與查詢 */
(function (G) {
  'use strict';
  const IT = G.IT || (G.IT = {});

  const PERSONS = ['io', 'tu', 'lui/lei', 'noi', 'voi', 'loro'];
  const PERSONS_ZH = ['我', '你', '他／她／您', '我們', '你們', '他們'];
  const REFL = ['mi', 'ti', 'si', 'ci', 'vi', 'si'];
  IT.PERSONS = PERSONS; IT.PERSONS_ZH = PERSONS_ZH;

  /* ---------- 冠詞 ---------- */
  // 回傳開頭類型：'lo'（s+子音、z、gn、ps、pn、x、y）、'v'（母音或 h）、'il'（其他）
  function initialType(word) {
    const w = String(word).toLowerCase();
    if (/^(s[bcdfghjklmnpqrstvwxz]|z|gn|ps|pn|x|y)/.test(w)) return 'lo';
    if (/^[aeiouàèéìíòóùúh]/.test(w)) return 'v';
    return 'il';
  }
  function defArt(word, g, plural) {
    const t = initialType(word);
    if (g === 'f') return plural ? 'le' : (t === 'v' ? "l'" : 'la');
    if (plural) return t === 'il' ? 'i' : 'gli';
    return t === 'il' ? 'il' : t === 'lo' ? 'lo' : "l'";
  }
  function indefArt(word, g) {
    const t = initialType(word);
    if (g === 'f') return t === 'v' ? "un'" : 'una';
    return t === 'lo' ? 'uno' : 'un';
  }
  function withArt(word, g, plural) {
    const a = defArt(word, g, plural);
    return a.endsWith("'") ? a + word : a + ' ' + word;
  }
  // 複數變陰性的名詞（il braccio → le braccia）與只用複數的名詞
  const PL_GENDER = { orecchio: 'f', uovo: 'f', braccio: 'f', dito: 'f', paio: 'f' };
  const PL_ONLY = new Set(['capelli', 'pantaloni', 'occhiali', 'soldi', 'contanti']);
  function nounForms(e) {
    const [w, , g, pl] = e;
    const sg = PL_ONLY.has(w) ? withArt(w, g, true) : withArt(w, g, false);
    const plural = (!pl || pl === '-') ? '' : withArt(pl, PL_GENDER[w] || g, true);
    return { sg, pl: PL_ONLY.has(w) ? '' : plural, plOnly: PL_ONLY.has(w), plGender: PL_GENDER[w] || g, indef: PL_ONLY.has(w) ? '' : indefArt(w, g) };
  }
  IT.nounForms = nounForms; IT.PL_GENDER = PL_GENDER; IT.PL_ONLY = PL_ONLY;
  IT.initialType = initialType; IT.defArt = defArt; IT.indefArt = indefArt; IT.withArt = withArt;

  /* ---------- 介係詞＋冠詞 ---------- */
  const PREP_BASE = { di: 'de', a: 'a', da: 'da', in: 'ne', su: 'su' };
  const ART_TAIL = { il: 'l', lo: 'llo', "l'": "ll'", la: 'lla', i: 'i', gli: 'gli', le: 'lle' };
  const ARTICLES = ['il', 'lo', "l'", 'la', 'i', 'gli', 'le'];
  const ART_INFO = {
    il: '陽性單數', lo: '陽性單數（s+子音、z、gn、ps、y 前）', "l'": '單數（母音前）', la: '陰性單數',
    i: '陽性複數', gli: '陽性複數（母音、s+子音、z 前）', le: '陰性複數'
  };
  function artPrep(prep, art) { return PREP_BASE[prep] + ART_TAIL[art]; }
  const ART_PREPS = {};
  for (const p of Object.keys(PREP_BASE)) for (const a of ARTICLES) ART_PREPS[artPrep(p, a)] = { prep: p, art: a };
  IT.ARTICLES = ARTICLES; IT.ART_INFO = ART_INFO; IT.ART_PREPS = ART_PREPS; IT.artPrep = artPrep;
  IT.SIMPLE_PREPS = ['di', 'a', 'da', 'in', 'con', 'su', 'per', 'tra', 'fra'];

  /* ---------- 名詞複數（規則預測，用於檢查資料） ---------- */
  function predictPlurals(w, g) {
    const s = new Set();
    if (/[àèéìòóù]$/.test(w) || /[^aeiou]$/.test(w) || /i$/.test(w)) { s.add(w); return s; }
    if (/ie$/.test(w)) { s.add(w); return s; }
    if (/cia$|gia$/.test(w)) {
      const pre = w[w.length - 4];
      if (/[aeiou]/.test(pre)) s.add(w.slice(0, -1) + 'e'); else s.add(w.slice(0, -2) + 'e');
      return s;
    }
    if (/(c|g)a$/.test(w)) { s.add(g === 'f' ? w.slice(0, -1) + 'he' : w.slice(0, -1) + 'hi'); return s; }
    if (/(c|g)o$/.test(w)) { s.add(w.slice(0, -1) + 'hi'); s.add(w.slice(0, -1) + 'i'); return s; }
    if (/io$/.test(w)) { s.add(w.slice(0, -1)); s.add(w.slice(0, -1) + 'i'); return s; }
    if (/a$/.test(w)) { s.add(g === 'f' ? w.slice(0, -1) + 'e' : w.slice(0, -1) + 'i'); return s; }
    if (/[oe]$/.test(w)) { s.add(w.slice(0, -1) + 'i'); return s; }
    return s;
  }
  IT.predictPlurals = predictPlurals;

  /* ---------- 形容詞 ---------- */
  // 傳回 [陽單, 陰單, 陽複, 陰複]
  function adjForms(entry) {
    const w = entry[0];
    if (entry[3] && entry[3] !== '-') {
      const p = entry[3].split('/');
      if (p.length === 3) return [w, p[0], p[1], p[2]];
    }
    if (/o$/.test(w)) return [w, w.slice(0, -1) + 'a', w.slice(0, -1) + 'i', w.slice(0, -1) + 'e'];
    if (/e$/.test(w)) return [w, w, w.slice(0, -1) + 'i', w.slice(0, -1) + 'i'];
    return [w, w, w, w];
  }
  function predictAdj(w) {
    if (/co$/.test(w)) return [[w.slice(0, -1) + 'a', w.slice(0, -1) + 'hi', w.slice(0, -1) + 'he'], [w.slice(0, -1) + 'a', w.slice(0, -1) + 'i', w.slice(0, -1) + 'he']];
    if (/go$/.test(w)) return [[w.slice(0, -1) + 'a', w.slice(0, -1) + 'hi', w.slice(0, -1) + 'he']];
    if (/cio$|gio$/.test(w)) return [[w.slice(0, -1) + 'a', w.slice(0, -2) + 'i', w.slice(0, -1) + 'e'], [w.slice(0, -1) + 'a', w.slice(0, -2) + 'i', w.slice(0, -2) + 'e']];
    if (/io$/.test(w)) return [[w.slice(0, -1) + 'a', w.slice(0, -2) + 'i', w.slice(0, -1) + 'e'], [w.slice(0, -1) + 'a', w.slice(0, -1) + 'i', w.slice(0, -1) + 'e']];
    if (/o$/.test(w)) return [[w.slice(0, -1) + 'a', w.slice(0, -1) + 'i', w.slice(0, -1) + 'e']];
    if (/e$/.test(w)) return [[w, w.slice(0, -1) + 'i', w.slice(0, -1) + 'i']];
    return [[w, w, w]];
  }
  IT.adjForms = adjForms; IT.predictAdj = predictAdj;

  /* ---------- 動詞 ---------- */
  const IRR = {
    essere: { p: 'sono sei è siamo siete sono', pp: 'stato', aux: 'e', imp: 'sii|sia|siamo|siate' },
    avere: { p: 'ho hai ha abbiamo avete hanno', pp: 'avuto', imp: 'abbi|abbia|abbiamo|abbiate' },
    andare: { p: 'vado vai va andiamo andate vanno', pp: 'andato', aux: 'e', imp: "va'/vai|vada|andiamo|andate" },
    fare: { p: 'faccio fai fa facciamo fate fanno', pp: 'fatto', imp: "fa'/fai|faccia|facciamo|fate" },
    dare: { p: 'do dai dà diamo date danno', pp: 'dato', imp: "da'/dai|dia|diamo|date" },

      body: '<p>以 dormire 為例：</p><table><tr><td>io dorm<b>o</b></td><td>noi dorm<b>iamo</b></td></tr><tr><td>tu dorm<b>i</b></td><td>voi dorm<b>ite</b></td></tr><tr><td>lui/lei dorm<b>e</b></td><td>loro dorm<b>ono</b></td></tr></table><p>和 -ere 只差 voi 的形（-ite）。</p>' },
    { id: 'pres-isc', tag: '動詞', title: '現在式：-ire 加 -isc- 的動詞', m: { tok: 'isc' },
      body: '<p>capire、finire、preferire、pulire、spedire 在 io、tu、lui/lei、loro 加 <b>-isc-</b>：</p><table><tr><td>io cap<b>isco</b></td><td>noi capiamo</td></tr><tr><td>tu cap<b>isci</b></td><td>voi capite</td></tr><tr><td>lui/lei cap<b>isce</b></td><td>loro cap<b>iscono</b></td></tr></table><p>發音：isco [isko]、isci [iʃi]。哪些動詞加 isc 要一個一個記。</p>' },
    { id: 'pres-irr', tag: '動詞', title: '常見不規則動詞（andare、fare、venire…）', m: { tok: 'irr' },
      body: '<table><tr><th></th><th>andare 去</th><th>fare 做</th><th>venire 來</th><th>uscire 出門</th></tr><tr><td>io</td><td>vado</td><td>faccio</td><td>vengo</td><td>esco</td></tr><tr><td>tu</td><td>vai</td><td>fai</td><td>vieni</td><td>esci</td></tr><tr><td>lui/lei</td><td>va</td><td>fa</td><td>viene</td><td>esce</td></tr><tr><td>noi</td><td>andiamo</td><td>facciamo</td><td>veniamo</td><td>usciamo</td></tr><tr><td>voi</td><td>andate</td><td>fate</td><td>venite</td><td>uscite</td></tr><tr><td>loro</td><td>vanno</td><td>fanno</td><td>vengono</td><td>escono</td></tr></table><p>其他：bere（bevo）、dire（dico）、stare（sto）、dare（do）、rimanere（rimango）。完整表請看「詞性變化規則」。</p>' },
    { id: 'modal', tag: '動詞', title: '情態動詞 potere、volere、dovere＋原形', m: { tok: 'modal' },
      body: '<table><tr><th></th><th>potere 能</th><th>volere 想要</th><th>dovere 必須</th></tr><tr><td>io</td><td>posso</td><td>voglio</td><td>devo</td></tr><tr><td>tu</td><td>puoi</td><td>vuoi</td><td>devi</td></tr><tr><td>lui/lei</td><td>può</td><td>vuole</td><td>deve</td></tr><tr><td>noi</td><td>possiamo</td><td>vogliamo</td><td>dobbiamo</td></tr><tr><td>voi</td><td>potete</td><td>volete</td><td>dovete</td></tr><tr><td>loro</td><td>possono</td><td>vogliono</td><td>devono</td></tr></table><p>後面直接接<b>原形動詞</b>：<i>Posso entrare?</i> <i>Devo studiare.</i></p>' },
    { id: 'sapere', tag: '動詞', title: 'sapere 和 conoscere 的差別', m: { re: w('so|sai|sa|sappiamo|sapete|sanno|conosco|conosci|conosce|conosciamo|conoscete|conoscono') },
      body: '<ul><li><b>sapere</b>：知道（一件事）、會（技能＋原形）：<i>Sai nuotare?</i> <i>Non so.</i></li><li><b>conoscere</b>：認識（人、地方）：<i>Conosci Marco?</i> <i>Conosco un buon ristorante.</i></li></ul><p>sapere 現在式：so, sai, sa, sappiamo, sapete, sanno。</p>' },
    { id: 'piacere', tag: '句型', title: 'mi piace／mi piacciono（我喜歡）', m: { re: w('(?:non )?(?:mi|ti|gli|le|ci|vi)(?: \\w+)? (?:piace|piacciono|piaceva|è piaciuto|è piaciuta)') },
      body: '<p>義大利文說「某物<b>讓我喜歡</b>」：喜歡的東西是主詞。</p><ul><li>單數或動詞原形 → <b>piace</b>：<i>Mi piace la pizza.</i> <i>Mi piace viaggiare.</i></li><li>複數 → <b>piacciono</b>：<i>Mi piacciono le patate.</i></li></ul><table><tr><td>mi 我</td><td>ti 你</td><td>gli 他</td><td>le 她／您</td><td>ci 我們</td><td>vi 你們</td></tr></table><p>否定：<i>Non mi piace la cipolla.</i></p>' },
    { id: 'refl', tag: '動詞', title: '反身動詞（mi chiamo、mi alzo）', m: { tok: 'refl' },
      body: '<p>原形以 <b>-si</b> 結尾的動詞（chiamarsi、alzarsi、lavarsi），動詞前要加反身代名詞：</p><table><tr><td>io <b>mi</b> alzo</td><td>noi <b>ci</b> alziamo</td></tr><tr><td>tu <b>ti</b> alzi</td><td>voi <b>vi</b> alzate</td></tr><tr><td>lui/lei <b>si</b> alza</td><td>loro <b>si</b> alzano</td></tr></table><p>過去式一律用 essere：<i>Mi sono alzato alle sette.</i> 命令式黏在後面：<i>Alzati!</i> <i>Lavati le mani!</i></p>' },
    { id: 'neg', tag: '句型', title: '否定句 non、non…mai、non…niente', m: { re: w('non') + '(?:[^.!?]*?' + w('mai|niente|ancora|più') + ')?' },
      body: '<p><b>non</b> 放在動詞前面：<i>Non parlo tedesco.</i></p><p>雙重否定在義大利文是正常的：</p><ul><li>non … mai 從不：<i>Non bevo mai il caffè.</i></li><li>non … niente 什麼都不：<i>Non mangio niente.</i></li><li>non … ancora 還沒：<i>Non ho ancora mangiato.</i></li></ul>' },
    { id: 'questions', tag: '句型', title: '疑問詞 chi、cosa、dove、come、quando、quanto、quale、perché', m: { re: w('chi|che cosa|cosa|dove|dov\'|come|com\'|quando|quanto|quanta|quanti|quante|quale|quali|qual|perché') + '(?=[^.!]*\\?)' },
      body: '<table><tr><td>chi 誰</td><td>cosa／che cosa 什麼</td></tr><tr><td>dove 哪裡（dov\'è）</td><td>come 怎麼</td></tr><tr><td>quando 什麼時候</td><td>quanto 多少（要配合：quanti anni）</td></tr><tr><td>quale 哪一個（qual è）</td><td>perché 為什麼</td></tr></table><p>是非疑問句不用改語序，只要語調上揚：<i>Parli inglese?</i></p>' },
    { id: 'prep', tag: '介係詞', title: '簡單介係詞 di、a、da、in、con、su、per、tra', m: { tok: 'simpleprep' },
      body: '<table><tr><td><b>di</b></td><td>…的；來自（城市）</td><td>il libro di Marco、sono di Roma</td></tr><tr><td><b>a</b></td><td>到／在（城市）、幾點</td><td>vado a Milano、alle otto</td></tr><tr><td><b>da</b></td><td>從；到某人家；自從</td><td>vengo da Napoli、vado dal medico</td></tr><tr><td><b>in</b></td><td>在／到（國家、區域）、交通工具</td><td>in Italia、in centro、in treno</td></tr><tr><td><b>con</b></td><td>和…一起</td><td>con gli amici</td></tr><tr><td><b>su</b></td><td>在…上；關於</td><td>sul tavolo</td></tr><tr><td><b>per</b></td><td>為了；給</td><td>per te</td></tr><tr><td><b>tra／fra</b></td><td>之間；…之後</td><td>tra due giorni</td></tr></table>' },
    { id: 'artprep', tag: '介係詞', title: '介係詞＋冠詞合併（del、al、nella…）', m: { tok: 'artprep' },
      body: '<p>di、a、da、in、su 後面接定冠詞時要合成一個字：</p><table class="wide"><tr><th></th><th>il</th><th>lo</th><th>l\'</th><th>la</th><th>i</th><th>gli</th><th>le</th></tr><tr><td>di</td><td>del</td><td>dello</td><td>dell\'</td><td>della</td><td>dei</td><td>degli</td><td>delle</td></tr><tr><td>a</td><td>al</td><td>allo</td><td>all\'</td><td>alla</td><td>ai</td><td>agli</td><td>alle</td></tr><tr><td>da</td><td>dal</td><td>dallo</td><td>dall\'</td><td>dalla</td><td>dai</td><td>dagli</td><td>dalle</td></tr><tr><td>in</td><td>nel</td><td>nello</td><td>nell\'</td><td>nella</td><td>nei</td><td>negli</td><td>nelle</td></tr><tr><td>su</td><td>sul</td><td>sullo</td><td>sull\'</td><td>sulla</td><td>sui</td><td>sugli</td><td>sulle</td></tr></table><p>con、per 不合併：con il、per la。</p>' },
    { id: 'place', tag: '介係詞', title: '地點：a 和 in 的用法', m: { re: w("a|in|ad") + ' (?:roma|milano|firenze|venezia|napoli|bologna|taipei|siena|italia|taiwan|casa|scuola|centro|montagna|campagna|ufficio|banca|piscina|palestra|biblioteca|pizzeria|vacanza|spiaggia|cucina|giardino|piazza|città|sardegna|toscana|letto|soggiorno|bagno)' + E },
      body: '<ul><li><b>a</b> ＋ 城市：a Roma、a Taipei；也用在 a casa、a scuola、a letto</li><li><b>in</b> ＋ 國家、大區、島：in Italia、in Toscana、in Sardegna</li><li><b>in</b> ＋ 很多場所：in centro、in banca、in ufficio、in montagna、in biblioteca、in vacanza</li><li>有冠詞時用合併形：al mare、al cinema、alla stazione、nel parco</li></ul>' },
    { id: 'transport', tag: '介係詞', title: '交通方式：in treno、a piedi', m: { re: w("in (?:treno|macchina|bicicletta|autobus|aereo|metro|taxi|moto)|a piedi|con la nave") },
      body: '<p>搭交通工具用 <b>in</b>（不加冠詞）：in treno、in macchina、in aereo、in bicicletta、in autobus、in metro。</p><p>走路是 <b>a piedi</b>。</p><p>「搭」也可以用 prendere：<i>Prendo l\'autobus.</i></p>' },
    { id: 'poss', tag: '限定詞', title: '所有格 mio、tuo、suo…', m: { tok: 'poss' },
      body: '<table><tr><th></th><th>陽單</th><th>陰單</th><th>陽複</th><th>陰複</th></tr><tr><td>我的</td><td>il mio</td><td>la mia</td><td>i miei</td><td>le mie</td></tr><tr><td>你的</td><td>il tuo</td><td>la tua</td><td>i tuoi</td><td>le tue</td></tr><tr><td>他／她／您的</td><td>il suo</td><td>la sua</td><td>i suoi</td><td>le sue</td></tr><tr><td>我們的</td><td>il nostro</td><td>la nostra</td><td>i nostri</td><td>le nostre</td></tr><tr><td>你們的</td><td>il vostro</td><td>la vostra</td><td>i vostri</td><td>le vostre</td></tr><tr><td>他們的</td><td>il loro</td><td>la loro</td><td>i loro</td><td>le loro</td></tr></table><p>所有格要配合<b>被擁有的東西</b>，不是擁有者：<i>Marco ama sua moglie.</i></p><p>單數家人<b>不加冠詞</b>：mio padre、mia sorella（但 la mia famiglia、i miei fratelli、il mio ragazzo 要加）。</p>' },
    { id: 'demo', tag: '限定詞', title: '指示詞 questo、quello', m: { tok: 'demo' },
      body: '<p><b>questo</b>（這個）像一般 -o 形容詞：questo, questa, questi, queste（母音前可寫 quest\'）。</p><p><b>quello</b>（那個）在名詞前像定冠詞一樣變化：</p><table><tr><td>il → quel libro</td><td>i → quei libri</td></tr><tr><td>lo → quello studente</td><td>gli → quegli studenti</td></tr><tr><td>l\' → quell\'uomo</td><td>la → quella ragazza、le → quelle ragazze</td></tr></table>' },
    { id: 'numbers', tag: '數字時間', title: '數字 0–1000', m: { tok: 'num' },
      body: '<p>1–10：uno, due, tre, quattro, cinque, sei, sette, otto, nove, dieci</p><p>11–20：undici, dodici, tredici, quattordici, quindici, sedici, diciassette, diciotto, diciannove, venti</p><p>十位：trenta, quaranta, cinquanta, sessanta, settanta, ottanta, novanta, cento, mille（兩千 duemila）</p><p>21、28 去掉母音：ventuno、ventotto；23 寫 ventitré（有重音）。</p>' },
    { id: 'time', tag: '數字時間', title: '幾點了？Che ore sono?', m: { re: w("che ore sono|sono le \\w+(?: e (?:mezza|un quarto|\\w+))?|è l'una|alle \\w+|all'una|a mezzogiorno|a mezzanotte|e mezza|e un quarto") },
      body: '<ul><li><i>Che ore sono?</i> 現在幾點？</li><li><i>Sono le tre.</i>（複數 le，因為是 le ore）</li><li><i>È l\'una.</i> 一點；<i>È mezzogiorno.</i> 中午</li><li>3:30 <i>le tre e mezza</i>；2:15 <i>le due e un quarto</i></li><li>在幾點：<b>alle</b> otto、<b>all\'</b>una、<b>a</b> mezzogiorno</li></ul>' },
    { id: 'dates', tag: '數字時間', title: '星期、月份、季節', m: { re: w('lunedì|martedì|mercoledì|giovedì|venerdì|sabato|domenica|gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre|primavera|estate|autunno|inverno') },
      body: '<p>星期、月份都<b>小寫</b>。星期除了 la domenica 都是陽性。</p><ul><li>加冠詞表示「每個」：<i>il sabato</i> 每個星期六；不加是「這個」：<i>sabato</i> 這個星期六</li><li>月份用 <b>a</b>：a maggio、ad agosto</li><li>季節用 <b>in</b>：in estate、in inverno（也說 d\'estate）</li></ul>' },
    { id: 'weather', tag: '句型', title: '天氣怎麼說', m: { re: w("che tempo fa|fa (?:molto )?(?:caldo|freddo|bel tempo|brutto tempo|brutto)|piove|nevica|c'è (?:il sole|vento|la nebbia|molta neve)") },
      body: '<ul><li><i>Che tempo fa?</i> 天氣怎麼樣？</li><li>用 <b>fare</b>：fa caldo、fa freddo、fa bel tempo、fa brutto tempo</li><li>動詞本身：piove（下雨）、nevica（下雪）</li><li>用 c\'è：c\'è il sole、c\'è vento、c\'è la nebbia</li></ul><p>人覺得冷熱用 avere：<i>Ho freddo.</i></p>' },
    { id: 'pp-avere', tag: '過去式', title: 'passato prossimo（一）：avere＋過去分詞', m: { tok: 'passAvere' }, ex: [['Ho comprato una giacca nuova.', '我買了一件新外套。'], ['Abbiamo mangiato la pizza a Napoli.', '我們在拿坡里吃了披薩。'], ['Hai fatto i compiti?', '你寫作業了嗎？'], ['Ieri sera ho letto un libro.', '昨晚我讀了一本書。']],
      body: '<p>表示「做過、已經做了」：<b>avere 現在式＋過去分詞</b>。</p><p>過去分詞：-are → <b>-ato</b>、-ere → <b>-uto</b>、-ire → <b>-ito</b>（mangiato、avuto、dormito）。</p><table><tr><td>ho mangiato</td><td>abbiamo mangiato</td></tr><tr><td>hai mangiato</td><td>avete mangiato</td></tr><tr><td>ha mangiato</td><td>hanno mangiato</td></tr></table><p>常見不規則分詞：fatto、detto、letto、scritto、preso、visto、messo、aperto、chiuso、bevuto、perso。</p>' },
    { id: 'pp-essere', tag: '過去式', title: 'passato prossimo（二）：essere＋過去分詞', m: { tok: 'passEssere' }, ex: [['Anna è arrivata alle otto.', '安娜八點到了。'], ['Siamo andati al mare.', '我們去了海邊。'], ['Mi sono alzato tardi.', '我起得很晚。'], ['Le ragazze sono uscite ieri sera.', '女孩們昨晚出去了。']],
      body: '<p>移動、狀態改變的動詞（andare、venire、arrivare、partire、uscire、tornare、nascere、restare、stare…）和所有反身動詞用 <b>essere</b>。</p><p>這時分詞要跟主詞<b>配合性別和單複數</b>：</p><ul><li>Marco è andat<b>o</b>／Anna è andat<b>a</b></li><li>Siamo partit<b>i</b>／Le ragazze sono uscit<b>e</b></li></ul><p>App 裡每個動詞的變化表都有標出用 essere 還是 avere。</p>' },
    { id: 'imper', tag: '動詞', title: '命令式（Apri la finestra!）', m: { tok: 'imper' },
      body: '<table><tr><th></th><th>-are（parlare）</th><th>-ere（prendere）</th><th>-ire（aprire）</th></tr><tr><td>tu</td><td>parla</td><td>prendi</td><td>apri</td></tr><tr><td>Lei（您）</td><td>parli</td><td>prenda</td><td>apra</td></tr><tr><td>noi</td><td>parliamo</td><td>prendiamo</td><td>apriamo</td></tr><tr><td>voi</td><td>parlate</td><td>prendete</td><td>aprite</td></tr></table><p>注意 -are 和 -ere/-ire 的 tu、Lei 剛好相反。對 tu 的否定用 non＋原形：<i>Non cadere!</i></p><p>不規則：va\'（andare）、fa\'（fare）、vieni、sii、abbi、di\'（dire）。</p>' },
    { id: 'lei', tag: '句型', title: '敬稱 Lei（您）', m: { re: w("scusi|mi scusi|può|desidera|si sieda|vada|giri|compili|firmi|come sta|che taglia porta|ha una camera|ha un documento|mi porta") },
      body: '<p>對陌生人、店員、長輩用 <b>Lei</b>（您），動詞用<b>第三人稱單數</b>：</p><ul><li><i>Come sta?</i>（您好嗎）↔ <i>Come stai?</i>（你好嗎）</li><li><i>Scusi</i>（對您）↔ <i>Scusa</i>（對你）</li><li><i>Può ripetere?</i> 您可以再說一次嗎？</li></ul><p>寫的時候 Lei 常大寫，跟 lei（她）區分。</p>' },
    { id: 'compar', tag: '形容詞', title: '比較 più／meno … di', m: { re: w('più|meno') + '[^.!?]*?(?:' + w('di|del|della|dei|delle') + "|dell')|" + w('più|meno') }, ex: [['Roma è più grande di Firenze.', '羅馬比佛羅倫斯大。'], ['La pizza è meno cara della carne.', '披薩比肉便宜。']],
      body: '<ul><li>A è <b>più</b> + 形容詞 + <b>di</b> B：<i>Lui è più alto di me.</i>（他比我高）</li><li>A è <b>meno</b> + 形容詞 + <b>di</b> B：<i>Il treno è meno caro dell\'aereo.</i></li><li>di 後面接冠詞要合併：dell\'aereo、della pizza</li></ul><p>特別形：buono → <b>migliore</b>（更好的）。</p>' },
    { id: 'molto', tag: '形容詞', title: 'molto、tanto、troppo、poco', m: { re: w("molto|molta|molti|molte|troppo|troppa|troppi|troppe|poco|poca|pochi|poche|un po'|tanto|tanta|tanti|tante") },
      body: '<ul><li>當<b>副詞</b>（修飾形容詞、動詞）不變化：<i>È molto buona.</i> <i>Lavoro troppo.</i></li><li>當<b>形容詞</b>（修飾名詞）要配合：<i>molta gente</i>、<i>molti turisti</i>、<i>molte nuvole</i></li><li><i>un po\' (di)</i> 一點點：<i>Parlo un po\' di italiano.</i></li></ul>' },
    { id: 'vorrei', tag: '句型', title: '禮貌請求 vorrei、potrei', m: { re: w('vorrei|vorresti|vorrebbe|vorremmo|potrei|potresti|potrebbe|per favore') },
      body: '<p>點餐、購物時用 <b>vorrei</b>（我想要，比 voglio 客氣）：</p><ul><li><i>Vorrei un caffè, per favore.</i></li><li><i>Vorrei prenotare un tavolo.</i></li><li><i>Potrebbe ripetere?</i> 您可以再說一次嗎？</li></ul><p>vorrei 是 volere 的條件式，A1 先當成固定說法記住。</p>' },
    { id: 'stare', tag: '動詞', title: 'stare：Come stai? Sto bene.', m: { re: w('come (?:stai|sta|state)|(?:sto|stai|sta|stiamo|state|stanno) (?:bene|male)') },
      body: '<p>問候身體狀況用 <b>stare</b>：</p><ul><li><i>Come stai?</i>（你好嗎）<i>Come sta?</i>（您好嗎）</li><li><i>Sto bene, grazie.</i> <i>Sto male.</i> <i>Così così.</i></li></ul><p>stare 現在式：sto, stai, sta, stiamo, state, stanno。</p>' },
    { id: 'andare', tag: '動詞', title: 'andare a／andare in／venire da', m: { re: w('vado|vai|va|andiamo|andate|vanno|vengo|vieni|viene|veniamo|venite|vengono') + " (?:a|in|al|alla|allo|all'|ai|alle|da|dal|dalla|con|al)" + E },

const Sfx = {
  ctx: null,
  vol() { return { on: 1, low: 0.45, off: 0 }[SET.sfx] ?? 1; },
  ac() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});

  },
  tone(f, dur, type = 'sine', v = 0.08, f2 = 0, at = 0) {

    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);

    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v * k, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  },

  noise(dur, freq, q, v, at = 0) {

    const t = c.currentTime + at, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.nbuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(v * k, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(c.destination); src.start(t); src.stop(t + dur + 0.02);
  },
  soft() { this.noise(0.045, 1100, 0.9, 0.14); this.tone(130, 0.045, 'sine', 0.07, 85); },
  blue() {
    this.noise(0.008, 4200, 2.5, 0.55); this.noise(0.022, 1900, 1.1, 0.22);
    this.tone(210, 0.035, 'triangle', 0.09, 120);
    this.noise(0.010, 3300, 2.2, 0.30, 0.055); this.tone(160, 0.025, 'sine', 0.05, 110, 0.055);
  },
  wood() { this.tone(820, 0.07, 'sine', 0.11, 620); this.tone(1640, 0.03, 'sine', 0.03, 1240); this.noise(0.01, 2000, 1, 0.08); },
  toggle(on) { const a = on ? 660 : 990, b = on ? 990 : 660; this.tone(a, 0.05, 'sine', 0.07); this.tone(b, 0.07, 'sine', 0.07, 0, 0.055); },
  tick() { this.noise(0.012, 5200, 2, 0.18); this.tone(1900, 0.025, 'sine', 0.035); },
  mallet(col) { const f = [523.3, 587.3, 659.3, 784, 880][col % 5] || 659.3; this.tone(f, 0.22, 'sine', 0.09); this.tone(f * 4, 0.05, 'sine', 0.025); },
  flip() {

    const t = c.currentTime, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.buf(c); f.type = 'bandpass'; f.Q.value = 0.9;
    f.frequency.setValueAtTime(700, t); f.frequency.exponentialRampToValueAtTime(3200, t + 0.09);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16 * k, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    src.connect(f).connect(g).connect(c.destination); src.start(t); src.stop(t + 0.13);
  },
  peek() { this.tone(1200, 0.05, 'sine', 0.05, 1700); },
  slide() { this.noise(0.06, 1800, 0.8, 0.12); this.tone(150, 0.035, 'sine', 0.1, 100, 0.05); this.noise(0.015, 3000, 1.2, 0.25, 0.05); },
  pop() { this.tone(520, 0.06, 'sine', 0.08, 900); this.noise(0.012, 2600, 1.5, 0.18); },
  unpop() { this.tone(900, 0.06, 'sine', 0.07, 480); },
  ok() { this.tone(880, 0.12, 'sine', 0.09); this.tone(1318.5, 0.2, 'sine', 0.09, 0, 0.09); },
  ng() { this.tone(240, 0.22, 'triangle', 0.09, 150); },

  for (const t of IT.tokenize(s)) {

    if (o.blank && start === o.blank[0]) { out += o.blankHTML; continue; }

    if (!t.w) { out += esc(t.t); continue; }
    const tk = `<span class="tk" role="button" tabindex="0" data-w="${esc(t.t)}">${esc(t.t)}</span>`;

function libCounts() {
  const t = today(), rset = recentIds();
  const c = { total: WORDS.length, learned: 0, queued: 0, excluded: 0, due: 0, mcW: 0, mcR: 0, fillW: 0, fillR: 0, recent: 0 };
  for (const w of WORDS) {
    const r = getRec(w.id);
    if (r.s === 'learned') { c.learned++; if (r.due && r.due <= t) c.due++; }
    if (r.s === 'queued') c.queued++;
    if (r.s === 'excluded') c.excluded++;
    if (rset.has(w.id)) c.recent++;
    const ww = r.w || {};
    if (ww.mc === 1) c.mcW++; if (ww.mc === 2) c.mcR++;
    if (ww.fill === 1) c.fillW++; if (ww.fill === 2) c.fillR++;
  }
  return c;
}

function doSearch(qs) {

  let hits = WORDS.filter(w => IT.stripAccents((w.word + ' ' + w.title + ' ' + w.e[3]).toLowerCase()).includes(qa) || w.zh.includes(qs.trim()) || (q.length > 1 && /^[a-z ]+$/.test(q) && w.en.toLowerCase().includes(q)));
  hits.sort((a, b) => (IT.stripAccents(a.word.toLowerCase()).startsWith(qa) ? 0 : 1) - (IT.stripAccents(b.word.toLowerCase()).startsWith(qa) ? 0 : 1));
  hits = hits.slice(0, 30);
  if (!hits.length) { box.innerHTML = '<div class="meta">找不到符合的字。</div>'; return; }

    const lg = $('#syncLong'); if (lg) lg.textContent = this.label();
    renderAuthBox();
  },
  init() {
    try {
      if (!window.firebase || !window.N5_FIREBASE) return;
      if (!firebase.apps.length) firebase.initializeApp(window.N5_FIREBASE);
      this.fb = { auth: firebase.auth(), db: firebase.firestore() };
      this.mode = 'google';
      this.set('signedout');
      this.fb.auth.getRedirectResult().catch(e => this.authError(e));
      this.fb.auth.onAuthStateChanged(u => {
        if (u) { this.user = u; this.attach(this.fb.db.collection('users').doc(u.uid)); }
        else { this.detach(); this.user = null; this.set('signedout'); }
      });
    } catch (e) { this.mode = 'local'; this.set('local'); }
  },
  async signIn() {
    if (!this.fb) return;
    const prov = new firebase.auth.GoogleAuthProvider();
    prov.setCustomParameters({ prompt: 'select_account' });
    try { await this.fb.auth.signInWithPopup(prov); }
    catch (e) {
      if (e && /popup-blocked|operation-not-supported/.test(e.code || '')) { try { await this.fb.auth.signInWithRedirect(prov); } catch (e2) { this.authError(e2); } }
      else this.authError(e);
    }
  },
  async signOut() { if (!this.fb) return; await this.upload(); await this.fb.auth.signOut(); toast('已登出，進度仍保留在這台裝置'); },
  authError(e) {
    const c = (e && e.code) || '';
    if (/popup-closed|cancelled-popup/.test(c)) return;
    toast(/unauthorized-domain/.test(c) ? '登入失敗：Firebase 還沒允許這個網址' : /network/.test(c) ? '登入失敗：請確認網路連線' : '登入失敗，請再試一次');
  },
  attach(ref) {
    this.detach();
    this.ref = ref; this.remote = null;
    this.set('connecting');
    this.unsub = ref.onSnapshot(snap => {
      const d = snap && snap.exists ? (snap.data() || {}) : {};
      this.remote = { items: d.items || {}, days: d.days || {} };
      this.absorb(this.remote);
      if (this.state === 'connecting' || this.state === 'error') this.set('synced');
      this.schedule(300);
    }, () => this.set('error'));
  },
  detach() { if (this.unsub) { try { this.unsub(); } catch (e) {} } this.unsub = null; this.ref = null; this.remote = null; },
  absorb(remote) {
    reloadShared();
    const merged = mergeState(S, remote);
    if (JSON.stringify(merged) === JSON.stringify({ items: S.items, days: S.days })) return;
    S = merged; saveLocal(); refreshPassive();
  },
  needsUpload() {
    if (!this.remote) return false;
    const ri = this.remote.items, rd = this.remote.days;
    for (const id in S.items) { const a = S.items[id], b = ri[id]; if (!b || (a.t || 0) > (b.t || 0)) return true; }
    for (const d in S.days) if ((S.days[d] || 0) > (rd[d] || 0)) return true;
    return false;
  },
  schedule(ms = 2500) { if (!this.ref) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.upload(), ms); },
  async upload() {
    if (!this.ref || !this.remote || this.state === 'readonly') return;
    if (this.writing) { this.again = true; return; }
    reloadShared();
    if (!this.needsUpload()) return;
    this.writing = true; this.set('saving');
    try {
      const snap = await this.ref.get();
      const d = snap && snap.exists ? (snap.data() || {}) : {};
      S = mergeState(S, { items: d.items || {}, days: d.days || {} }); saveLocal();
      await this.ref.set({ items: S.items, days: S.days, v: 1, updated: Date.now() });
      this.remote = JSON.parse(JSON.stringify({ items: S.items, days: S.days }));
      this.set('synced');
    } catch (e) {
      if (e && (e.code === 'invalid_argument' || e.code === 'permission-denied')) this.set('error');
      else if (e && e.code === 'unavailable') { this.set('error'); setTimeout(() => this.schedule(500), 3000 + Math.random() * 2000); }
      else this.set('error');
    } finally { this.writing = false; if (this.again) { this.again = false; this.schedule(800); } }
  }
};
const GOOGLE_G = '<svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
function renderAuthBox() {
  const top = $('#authTop');
  if (top) {
    if (Cloud.mode === 'google' && !Cloud.user) {
      top.innerHTML = `<div class="authcard"><div><b>用 Google 帳號存進度</b><div class="meta">日文和義大利文的進度會一起存到雲端。</div></div><button class="btn solid gbtn-signin" id="gInTop">${GOOGLE_G}登入</button></div>`;
      $('#gInTop', top).onclick = () => Cloud.signIn();
    } else top.innerHTML = '';
  }
  const box = $('#authBox'); if (!box) return;
  if (Cloud.mode !== 'google') { box.innerHTML = ''; return; }
  if (Cloud.user) {
    box.innerHTML = `<div class="row"><span class="meta">${esc(Cloud.user.email || Cloud.user.displayName || '已登入')}</span><button class="btn quiet" id="gOut" style="min-height:40px">登出</button></div>`;
    $('#gOut', box).onclick = () => Cloud.signOut();
  } else {
    box.innerHTML = `<button class="btn solid block gbtn-signin" id="gIn">${GOOGLE_G}用 Google 登入</button>`;
    $('#gIn', box).onclick = () => Cloud.signIn();
  }
}
// 從雲端或日文頁合併進來後，只更新不會打斷作答的地方
function refreshPassive(force) {
  renderGoal();
  if (UI.tab === 'lib' && (force || (!$('#bk')?.innerHTML && !document.activeElement?.matches?.('#q')))) renderLib();
  if (force && UI.tab === 'card') renderCard();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { reloadShared(); renderGoal(); Cloud.schedule(500); } });

window.addEventListener('storage', e => { if (e.key === 'n5:progress') { reloadShared(); renderGoal(); } if (e.key === 'n5:settings') { Object.assign(SET, store.get('n5:settings', {})); applyTheme(); } });

applyTheme();
renderGoal();
Voice.init();
showTab(UI.tab);
Cloud.init();
window.ITApp = { showTab, openWord, openToken, getRec, record, touch, S: () => S, UI, SET, WORDS };
