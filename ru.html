          <label class="label" for="roundSel">每輪題數</label>
          <select id="roundSel">${[10, 15, 20, 30, 50, 'all'].map(n => `<option value="${n}"${String(SET.round) === String(n) || (n === 20 && !SET.round) ? ' selected' : ''}>${n === 'all' ? '全部' : n + ' 題'}</option>`).join('')}</select>
          <label class="label" for="recentSet">「最近學過」的範圍</label>
          <select id="recentSet">${RECENT_OPTS.map(([k, l]) => `<option value="${k}"${SET.recent === k ? ' selected' : ''}>${l}</option>`).join('')}</select>
          <label class="label" for="hintSel">填空的提示（第一個${P.hintUnit}、${P.hintUnit}數）</label>
          <select id="hintSel"><option value="tap"${SET.fillHint !== 'show' ? ' selected' : ''}>按「提示」才顯示</option><option value="show"${SET.fillHint === 'show' ? ' selected' : ''}>一開始就顯示</option></select>
          <div class="meta">每輪題數會套用到${P.roundTabs}。「最近學過」一輪會出完範圍內的全部字；錯題複習每輪 10 題，從以前錯過的字輪流抽，抽過的要等其他字都出過才會再出現。</div>
          <label class="label" for="dueCapSel">每天到期複習最多幾個字</label>
          <select id="dueCapSel">${DUE_CAPS.map(n => `<option value="${n}"${String(SET.dueCap || 30) === String(n) ? ' selected' : ''}>${n === 'all' ? '不限' : n + ' 個'}</option>`).join('')}</select>
          <div class="meta">到期的字很多時，先出到期最久的；今天沒做到的明天接著做。答錯一次只降兩級，不會整個重來。</div>
        </section>
        ${P.langHTML()}
        <section><h4>單字意思</h4>
          <label class="label" for="meanSel">顯示哪種語言的意思</label>
          <select id="meanSel"><option value="zh"${SET.mean === 'zh' ? ' selected' : ''}>中文</option><option value="en"${SET.mean === 'en' ? ' selected' : ''}>English</option><option value="both"${SET.mean === 'both' ? ' selected' : ''}>中文＋English</option></select>
          <div class="meta">字卡、單選、單字庫和點字看意思都會跟著換。${P.meanNote}</div>
        </section>
        ${P.extraHTML()}
        <section><h4>同步與備份</h4>
          <div class="meta" id="syncLong">${esc(Cloud.label())}</div>
          <div id="authBox"></div>
          <div class="row"><button class="btn quiet" id="exp">匯出進度</button><button class="btn quiet" id="imp">匯入進度</button></div>
          ${P.syncNote ? `<div class="meta">${P.syncNote}</div>` : ''}
          <div id="bk"></div>
        </section>
        ${P.endHTML ? P.endHTML() : ''}
      </div>
    </details>`;
  $$('[data-go]', host).forEach(b => b.onclick = () => {
    const [tab, src] = b.dataset.go.split(':');
    UI.pos = 'all';
    if (tab === 'mc') { UI.mcSrc = src; if (P.onEntryMc) P.onEntryMc(); mcRound = null; }
    if (tab === 'fill') { UI.fillSrc = src; fillRound = null; }
    if (tab === 'card') { UI.cardSrc = src; deck = null; }
    saveUI(); showTab(tab);
  });
  const lb = $('#listBox');
  lb.addEventListener('toggle', () => { if (lb.open) fillList(lb); });
  $$('[data-list]', lb).forEach(b => b.onclick = () => { libList = b.dataset.list; $$('[data-list]', lb).forEach(x => x.setAttribute('aria-pressed', String(x === b))); fillList(lb); });
  const q = $('#q');
  q.addEventListener('input', () => { UI.libQ = q.value; doSearch(q.value); });
  if (q.value) doSearch(q.value);
  renderVoiceBox(); renderAuthBox();
  $('#roundSel').onchange = e => { SET.round = e.target.value === 'all' ? 'all' : Number(e.target.value); saveSet(); mcRound = null; fillRound = null; deck = null; if (P.resetRounds) P.resetRounds(); toast(SET.round === 'all' ? '每輪：全部' : `每輪 ${SET.round} 題`); };
  $('#dueCapSel').onchange = e => { SET.dueCap = e.target.value === 'all' ? 'all' : Number(e.target.value); saveSet(); fillRound = null; toast(SET.dueCap === 'all' ? '到期複習：不限' : `到期複習：每天最多 ${SET.dueCap} 個`); };
  $('#hintSel').onchange = e => { SET.fillHint = e.target.value; saveSet(); fillRound = null; toast(SET.fillHint === 'show' ? '填空提示：一開始就顯示' : '填空提示：按了才顯示'); };
  $('#recentSet').onchange = e => { SET.recent = e.target.value; saveSet(); mcRound = null; fillRound = null; toast(`最近學過：${recentLabel()}`); renderLib(); };
  $('#vibSel').onchange = e => { SET.vib = e.target.value; saveSet(); buzz(true); };
  $('#vibTest').onclick = testBuzz;
  $('#sfxSel').onchange = e => { SET.sfx = e.target.value; saveSet(); if (SET.sfx !== 'off') Sfx.ok(); };
  $('#meanSel').onchange = e => { SET.mean = e.target.value; saveSet(); mcRound = null; toast({ zh: '單字意思：中文', en: '單字意思：English', both: '單字意思：中文＋English' }[SET.mean]); };
  P.bind(host);
  $('#exp').onclick = async () => {
    reloadShared();
    const txt = await zipCode(packState(S, today()));
    $('#bk').innerHTML = `<textarea id="bkText" readonly aria-label="備份碼" style="min-height:72px">${esc(txt)}</textarea><div class="row" style="margin-top:8px"><button class="btn solid" id="copyBk">複製</button><span class="meta">${P.expNote(txt.length)}</span></div>`;
    $('#copyBk').onclick = () => {
      const ta = $('#bkText');
      const fallback = () => { ta.focus(); ta.select(); toast('已選取，請按複製'); };
      try { navigator.clipboard.writeText(txt).then(() => toast('已複製'), fallback); } catch (e) { fallback(); }
    };
  };
  $('#imp').onclick = () => {
    $('#bk').innerHTML = `<textarea id="impText" placeholder="貼上備份碼（N5 開頭）" aria-label="貼上備份碼"></textarea><div class="row" style="margin-top:8px"><button class="btn solid" id="doImp">合併匯入</button><span class="meta">${P.impNote}</span></div><div id="impMsg" class="meta"></div>`;
    $('#doImp').onclick = async () => {
      try {
        const raw = $('#impText').value.replace(/\s+/g, '');
        const d = raw.startsWith('N5Z.') ? unpackState(await unzipCode(raw), ALL_IDS) : raw.startsWith('N5.') ? unpackState(raw, ALL_IDS) : JSON.parse(raw);
        if (!d || typeof d.items !== 'object') throw new Error('bad');
        const clean = {};
        for (const id in d.items) if (P.impKeep(id)) clean[id] = d.items[id];
        reloadShared();
        S = mergeState(S, { items: clean, days: d.days || {} });
        saveLocal(); Cloud.schedule(); renderGoal(); renderLib();
        toast(P.impToast(Object.keys(clean).length));
      } catch (e) { $('#impMsg').textContent = '無法讀取：請貼上完整的備份碼（以 N5 開頭）。'; }
    };
  };
}
function fillList(d) {
  const key = libList;
  let arr = wordPool(key);
  if (key === 'learned') arr = arr.slice().sort((a, b) => (getRec(a.id).due || '').localeCompare(getRec(b.id).due || ''));
  const box = $('.lrows', d);
  if (!arr.length) { box.innerHTML = '<div class="lrow"><span class="z">目前是空的</span></div>'; return; }
  const act = { queued: '移除', learned: '移回未學', mcWrong: '移除', mcReview: '移除', fillWrong: '移除', fillReview: '移除', excluded: '恢復' }[key];
  box.innerHTML = arr.map(w => {
    const r = getRec(w.id);
    const dd = key === 'learned' ? `<span class="d">${r.due ? r.due.slice(5).replace('-', '/') : ''} · 第${(r.lv || 0) + 1}級</span>` : '';
    return `<div class="lrow">${PAGE.lib.wordCell(w)}<span class="z">${meanW(w)}</span>${dd}<button data-id="${esc(w.id)}">${act}</button></div>`;
  }).join('');
  $$('button[data-id]', box).forEach(b => b.onclick = () => {
    const id = b.dataset.id, r = getRec(id);
    if (key === 'queued') touch(id, { s: 'new' });
    else if (key === 'learned') touch(id, { s: 'new', lv: 0, due: '' });
    else if (key === 'excluded') touch(id, { s: 'new' });
    else { const w = Object.assign({}, r.w); delete w[/^mc/.test(key) ? 'mc' : 'fill']; touch(id, { w }); }
    b.closest('.lrow').remove();
    const n = $(`[data-list="${key}"] .n`, d); if (n) n.textContent = Math.max(0, +n.textContent - 1);
  });
}
// 切換語言選單裡的進度條（lang.js）
if (window.AppLangs && AppLangs.stats) AppLangs.stats(() => { const c = libCounts(); return { l: c.learned, t: Math.max(1, c.total - c.excluded) }; });
function doSearch(qs) {
  const box = $('#results');
  const q = qs.trim().toLowerCase();
  if (!q) { box.innerHTML = ''; return; }
  const qa = IT.stripAccents(q);
  let hits = WORDS.filter(w => IT.stripAccents((w.word + ' ' + w.title + ' ' + w.e[3]).toLowerCase()).includes(qa) || w.zh.includes(qs.trim()) || (q.length > 1 && /^[a-z ]+$/.test(q) && w.en.toLowerCase().includes(q)));
  hits.sort((a, b) => (IT.stripAccents(a.word.toLowerCase()).startsWith(qa) ? 0 : 1) - (IT.stripAccents(b.word.toLowerCase()).startsWith(qa) ? 0 : 1));
  hits = hits.slice(0, 30);
  if (!hits.length) { box.innerHTML = '<div class="meta">找不到符合的字。</div>'; return; }
  box.innerHTML = hits.map(w => {
    const r = getRec(w.id);
    const canQ = r.s === 'new' || r.s === 'excluded';
    return `<div class="res">
      <div class="hd"><span class="w" lang="${LC.id}" style="font-family:var(--font-ui);font-weight:700">${esc(w.title)}</span><span>${meanW(w)}</span>${posBadge(w)}</div>
      <div class="row"><span class="st ${r.s}">${STATUS_TXT[r.s] || '未學'}</span><span class="meta">作答 ${r.n || 0} 次</span></div>
      <div class="sent sm" lang="${LC.id}">${sentHTML(w.sent)}</div>
      <div class="meta" style="color:var(--fg)">${esc(w.sentZh)}</div>
      <div class="row">${playBtn(w.title, '單字')}${playBtn(w.sent, '例句')}${canQ ? `<button class="btn" data-q="${esc(w.id)}" style="min-height:44px">列入考題</button>` : ''}</div>
    </div>`;
  }).join('');
  $$('[data-q]', box).forEach(b => b.onclick = () => { touch(b.dataset.q, { s: 'queued' }); toast('已列入考題'); doSearch($('#q').value); });
}

// ================= 帳號同步（和日文頁同一份資料） =================
const Cloud = makeCloud({ getS: () => S, setS: v => { S = v; }, saveLocal, merge: mergeState, refresh: refreshPassive, toast, renderAuth: renderAuthBox, reload: reloadShared });   // 程式在 sync.js（所有語言頁共用）
const GOOGLE_G = '<svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
function renderAuthBox() {
  const top = $('#authTop');
  if (top) {
    if (Cloud.mode === 'google' && !Cloud.user) {
      top.innerHTML = `<div class="authcard"><div><b>用 Google 帳號存進度</b><div class="meta">每個語言的進度會一起存到雲端。</div></div><button class="btn solid gbtn-signin" id="gInTop">${GOOGLE_G}登入</button></div>`;
      $('#gInTop', top).onclick = () => Cloud.signIn();
    } else top.innerHTML = '';
  }
  const box = $('#authBox'); if (!box) return;
  if (Cloud.mode !== 'google') { box.innerHTML = ''; return; }
  if (Cloud.user) {
    box.innerHTML = `<div class="row"><span class="meta">${esc(Cloud.user.email || Cloud.user.displayName || '已登入')}</span><button class="btn quiet" id="gOut" style="min-height:40px">登出</button></div>`;
    $('#gOut', box).onclick = () => Cloud.signOut();
  } else {
    box.innerHTML = `<button class="btn solid block gbtn-signin" id="gIn">${GOOGLE_G}用 Google 登入</button>`;
    $('#gIn', box).onclick = () => Cloud.signIn();
  }
}
// 從雲端或日文頁合併進來後，只更新不會打斷作答的地方
function refreshPassive(force) {
  renderGoal();
  if (UI.tab === 'lib' && (force || (!$('#bk')?.innerHTML && !document.activeElement?.matches?.('#q')))) renderLib();
  if (force && UI.tab === 'card') renderCard();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { reloadShared(); renderGoal(); Cloud.schedule(500); } });
// 同一台裝置在別的分頁改了進度（例如日文頁）
window.addEventListener('storage', e => { if (e.key === 'n5:progress') { reloadShared(); renderGoal(); } if (e.key === 'n5:settings') { Object.assign(SET, store.get('n5:settings', {})); applyTheme(); applyGen(); } });

// ================= 啟動 =================
applyTheme();
renderGoal();
Voice.init();
showTab(UI.tab);
Cloud.init();
window.ITApp = { showTab, openWord, openToken, getRec, record, touch, S: () => S, UI, SET, WORDS };
})();

</script>
<script>if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(function(){})}</script>
