*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{background:transparent}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--pat) center bottom/cover no-repeat}
[hidden]{display:none!important}
body{font-family:var(--font-ui);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.ja{font-family:var(--font-ja)}
[lang="ja"]{font-family:var(--font-ja)}
ruby{ruby-position:over;ruby-align:center}
rt{font-size:.5em;color:var(--muted);font-family:var(--font-ja);letter-spacing:-.02em;line-height:1.1;ruby-align:center;position:relative;z-index:1}
mark{background:var(--mark);color:var(--mark-ink);border-radius:0;padding:0;display:inline-block;line-height:1.12;vertical-align:baseline}
mark.ms{border-top-left-radius:4px;border-bottom-left-radius:4px;padding-left:.08em}
mark.me{border-top-right-radius:4px;border-bottom-right-radius:4px;padding-right:.08em}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 頂部 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:8px}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.brand b{font-family:var(--font-kana);font-weight:600;color:var(--pri);margin-right:2px}
.goal{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.goal span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pri);border-radius:6px;transition:width .3s}
.iconbtn{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;color:var(--pri);font-size:14px;font-weight:600}
.iconbtn[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.iconbtn svg{width:20px;height:20px}

/* 主內容與分頁 */
main{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 24px)}
main .wrap{padding-block:16px}
.tab{display:flex;flex-direction:column;gap:16px}
.tab[hidden]{display:none!important}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabbar button{height:var(--tabh);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
.tabbar button .g{font-size:20px;line-height:1;font-family:var(--font-kana);font-weight:600;height:22px;display:flex;align-items:center}
.tabbar button .g svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--pri)}
.tabbar button[aria-current="page"] .g{background:var(--pri-soft);border-radius:999px;padding:0 14px}
@media (pointer:coarse){
  body.typing .top, body.typing .tabbar{display:none}
  body.typing main{padding-bottom:70vh}
}

/* 共用元件 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.segrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;white-space:nowrap;min-height:40px;border:0;border-radius:9px;background:none;color:var(--muted);font-weight:600;font-size:14px;padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--pri);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.possel{flex:none;min-height:38px;border-radius:999px;padding:0 10px;font-size:14px;color:var(--fg)}
.possel.on{border-color:var(--pri);color:var(--pri);font-weight:600}
.chip{flex:none;min-height:38px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:0 13px;font-size:14px;color:var(--fg);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.85;margin-left:4px}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--pri);background:var(--surface);color:var(--pri);font-weight:600;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.solid{background:var(--pri);color:var(--pri-ink)}
.btn.block{width:100%}
.btn.quiet{border-color:var(--line);color:var(--fg)}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.5;cursor:default}
.play{min-height:44px;min-width:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--pri);display:inline-flex;align-items:center;gap:6px;padding:0 14px;font-size:14px;font-weight:600}
.play svg{width:18px;height:18px}
.label{font-size:13px;color:var(--muted);letter-spacing:.04em}
.meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.pos{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-family:var(--font-ui)}
.romaji{font-family:var(--font-ui);color:var(--muted);font-size:14px;letter-spacing:.02em}
.hide-romaji .romaji{display:none}
.empty{text-align:center;padding:28px 12px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;color:var(--muted);max-width:32ch}
select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;max-width:100%}

/* 題目 */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.prompt{text-align:center;padding:18px 0 8px;display:flex;flex-direction:column;gap:6px;align-items:center}
.prompt .big{font-family:var(--font-ja);font-size:clamp(32px,9vw,44px);font-weight:500;line-height:1.5}
.prompt .big rt{font-size:.42em}
.prompt .kana{font-family:var(--font-kana);font-size:clamp(64px,22vw,96px);line-height:1.1;font-weight:600}
.prompt .zh{font-size:26px;font-weight:700}
.opts{display:grid;gap:12px;margin-top:12px}
.opt{min-height:56px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);display:flex;align-items:center;gap:12px;padding:8px 14px;text-align:left;width:100%}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--surface2);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.opt .t{flex:1;min-width:0;font-size:18px}
.opt .t.ja{font-size:22px}
.opt .t.kanab{font-family:var(--font-kana);font-size:30px;font-weight:600}
.opt .t rt{font-size:.5em}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .k{background:var(--ng);color:var(--surface)}
.verdict{font-weight:700;display:flex;align-items:center;gap:6px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.verdict svg{width:20px;height:20px}
.example{border-top:1px dashed var(--line);margin-top:6px;padding-top:16px;display:flex;flex-direction:column;gap:10px}
.sent{font-family:var(--font-ja);font-size:21px;line-height:2.15}
.sent rt{font-size:.5em}
.conj-ask{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;font-size:20px;color:var(--pri)}
.conj-ask b{background:var(--pri-soft);border-radius:10px;padding:4px 12px}
.conj-arrow{font-size:22px}
.conj-why{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.zhline{color:var(--fg)}
.afterbox{display:flex;flex-direction:column;gap:14px;margin-top:16px}

/* 填空 */
.blank{display:inline-block;min-width:3.5em;border-bottom:2.5px solid var(--pri);color:var(--pri);padding:0 .2em;text-align:center;line-height:1.3}
.blank.ok{border-color:var(--ok);color:var(--ok)} .blank.ng{border-color:var(--ng);color:var(--ng)}
.hint{display:flex;flex-direction:column;gap:2px;background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:15px}
.hint b{font-family:var(--font-ja);font-weight:700}
.answerrow{display:flex;gap:8px}
.answerrow input{flex:1;min-width:0;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:20px;font-family:var(--font-ja)}
.answerrow input:focus{border-color:var(--pri);outline:none}
.preview{font-size:14px;color:var(--muted);min-height:1.4em}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* 字卡 */
.fc{display:flex;flex-direction:column;gap:14px}
.fc .word{font-family:var(--font-ja);font-size:clamp(34px,10vw,44px);font-weight:500;line-height:1.45;text-align:center}
.fc .word rt{font-size:.4em}
.fc .sub{text-align:center;display:flex;flex-direction:column;gap:2px}
.fc .zh{font-size:22px;font-weight:700;text-align:center}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;border-radius:999px;padding:2px 10px;border:1px solid var(--ng);color:var(--ng)}
.fcbtns{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.fcbtns .wide{grid-column:1/-1}

/* 五十音表 */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.legend .l2{background:var(--pri);border-color:var(--pri)} .legend .l1{background:var(--pri-soft);border-color:var(--pri-mid)}
.ktable{display:grid;gap:5px}
.ktable.c5{grid-template-columns:repeat(5,1fr)}
.ktable.c3{grid-template-columns:repeat(3,1fr)}
.kc{min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px 2px}
.kc .kk{font-family:var(--font-kana);font-size:24px;font-weight:600;line-height:1.2}
.ktable.c3 .kc .kk{font-size:24px}
.kc .rr{font-size:12px;color:var(--muted)}
.kc.s1{background:var(--pri-soft);border-color:var(--pri-mid)}
.kc.s2{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.kc.s2 .rr{color:var(--pri-ink);opacity:.9}
.kc.sel{outline:3px solid var(--fg);outline-offset:1px}
.kgap{visibility:hidden}
.ksec h3{margin:6px 0 8px;font-size:15px}
.kdetail{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.sq{width:104px;height:104px;border:1.5px solid var(--ng);position:relative;display:flex;align-items:center;justify-content:center;font-family:var(--font-kana);font-size:72px;font-weight:600;color:var(--fg);background:var(--surface)}
.sq::before,.sq::after{content:"";position:absolute;border:0 dashed var(--ng);opacity:.45}
.sq::before{left:50%;top:0;bottom:0;border-left-width:1px}
.sq::after{top:50%;left:0;right:0;border-top-width:1px}
.sq span{position:relative;z-index:1}
.sq.small{width:72px;height:72px;font-size:46px}
.kinfo{display:flex;flex-direction:column;gap:6px;min-width:0}
.kinfo .rom{font-size:24px;font-weight:700}
.notes{display:flex;flex-direction:column;gap:16px;padding:0 14px 14px}
.note h3{margin:0 0 6px;font-size:16px}
.note p{margin:0 0 8px}
.exlist{display:grid;gap:8px}
.exitem{display:flex;align-items:center;gap:10px;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px}
.exitem .ja{font-size:20px}

/* 單字庫 */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.stat b{font-size:20px;font-variant-numeric:tabular-nums;line-height:1.25}
.stat span{font-size:11px;color:var(--muted);white-space:nowrap}
.search input{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:17px}
.search input:focus{border-color:var(--pri);outline:none}
.results{display:flex;flex-direction:column;gap:8px}
.res{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.res .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.res .w{font-family:var(--font-ja);font-size:24px}
.res .w rt{font-size:.45em}
.res .sent{font-size:18px}
.st{font-size:12px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--muted)}
.st.queued{border-color:var(--pri-mid);color:var(--pri)} .st.learned{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.entry{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.entry button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 12px;text-align:left;color:var(--fg);font-size:14px}
.entry button b{color:var(--pri);font-variant-numeric:tabular-nums}
.entry button.zero b{color:var(--muted);font-weight:400}
details.lst{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.lst summary{min-height:54px;gap:8px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;cursor:pointer;list-style:none;font-weight:600}
details.lst summary::-webkit-details-marker{display:none}
details.lst summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:10px}
details.lst[open] summary::after{transform:rotate(-135deg)}
details.lst summary .n{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.lrows{display:flex;flex-direction:column;border-top:1px solid var(--line);max-height:420px;overflow-y:auto}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .w{font-family:var(--font-ja);font-size:19px;flex:none}
.lrow .w rt{font-size:.5em}
.lrow .z{flex:1;min-width:0;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .d{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.lrow button{flex:none;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--pri);font-size:13px;padding:0 10px}
.sec-title{font-size:15px;font-weight:700;margin:6px 0 0}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:var(--pri)}
.warn{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:14px}
textarea{width:100%;min-height:110px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync{margin-left:auto;font-weight:400}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)}

.qh-l{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-width:0;flex:1}
.fc .qhead{flex-wrap:nowrap;align-items:flex-start}
.gbtn{flex:none;min-height:40px;border-radius:999px;border:1px solid var(--pri);background:var(--surface);color:var(--pri);font-weight:600;font-size:14px;padding:0 14px;display:inline-flex;align-items:center;gap:6px}
.gbtn b{background:var(--pri);color:var(--pri-ink);border-radius:999px;min-width:20px;height:20px;padding:0 6px;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.gbtn[aria-expanded="true"]{background:var(--pri-soft)}
.gpanel{background:var(--surface2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:14px}
.gp-title{font-size:13px;color:var(--muted);letter-spacing:.04em}
.gp-item{display:flex;flex-direction:column;gap:4px}
.gp-item + .gp-item{border-top:1px solid var(--line);padding-top:12px}
.gp-h{display:flex;align-items:center;gap:8px;font-size:16px}
.lv{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted)}
.gp-s{color:var(--fg);font-size:16px}
.gpanel p{margin:0}
/* 點單字 */
.tk{cursor:pointer;border-radius:4px;-webkit-tap-highlight-color:transparent;text-decoration:none;margin:0 1px;padding-bottom:2px;background-image:radial-gradient(circle,var(--muted) .9px,transparent 1.1px);background-size:4px 3px;background-repeat:repeat-x;background-position:0 100%;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tk.on{background:var(--pri-soft);text-decoration-color:var(--pri)}
.tk:focus-visible{outline:2px solid var(--pri)}
.gloss{position:fixed;z-index:35;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 10px);max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;box-shadow:0 10px 30px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:8px}
.gl-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.gl-word{font-family:var(--font-ja);font-size:30px;line-height:1.5}
.gl-word rt{font-size:.45em}
.gl-zh{font-size:18px;font-weight:600}
.gl-x{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center}
.gl-x svg{width:18px;height:18px}
.posbtn{display:inline-flex;align-items:center;gap:4px;min-height:32px;font-size:12px;color:var(--pri);border:1px solid var(--pri-mid);background:var(--surface);border-radius:8px;padding:0 8px;font-family:var(--font-ui)}
.posbtn span{font-size:15px;line-height:1}
.gloss.tall{max-height:min(72vh,640px)}
.gl-scroll{overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:0;margin:0 -4px;padding:0 4px}
.fm-type{display:flex;align-items:center;gap:8px;font-size:16px}
.fm-desc{margin:0;line-height:1.7}
.fm-note{margin:0;background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:14px}
.fm-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gl-scroll > *, .fm-row{flex-shrink:0}
.fm-item{border-bottom:1px solid var(--line)}
.fm-item:last-child{border-bottom:0}
.fm-row{display:flex;align-items:stretch;background:var(--surface)}
.fm-tg{flex:1;min-width:0;display:grid;grid-template-columns:5.5em 1fr;gap:2px 10px;align-items:center;text-align:left;border:0;background:none;padding:10px 4px 10px 12px;color:var(--fg);min-height:52px}
.fm-tg[aria-expanded="true"]{background:var(--pri-soft)}
.fm-tg:active{background:var(--pri-soft)}
.fm-say{flex:none;width:48px;border:0;border-left:1px solid var(--line);background:none;color:var(--pri);display:flex;align-items:center;justify-content:center}
.fm-say svg{width:18px;height:18px}
.fm-l{font-size:13px;color:var(--muted);grid-row:span 2}
.fm-s{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:19px;min-width:0}
.fm-s small{font-size:12px;color:var(--muted)}
.fm-n{font-size:13px;color:var(--muted)}
.fm-ex{background:var(--surface2);padding:12px;display:flex;flex-direction:column;gap:12px}
.fx-h{font-size:12px;color:var(--muted);letter-spacing:.04em}
.fx{display:flex;flex-direction:column;gap:4px}
.fx + .fx{border-top:1px dashed var(--line);padding-top:10px}
.fx-s{font-size:19px;line-height:2.1}
.fx-zh{font-size:14px}
.fx .play{min-height:36px;padding:0 10px;font-size:13px}
.gl-back{flex:none;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--pri);font-weight:600;padding:0 10px;align-self:center}
.gl-top .gl-word{flex:1;min-width:0}
.peek{margin-top:6px;background:var(--surface);border:1px solid var(--pri-mid);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pk-top{display:flex;align-items:center;gap:10px}
.pk-w{font-family:var(--font-ja);font-size:22px;line-height:1.5}
.pk-w rt{font-size:.45em}
.pk-x{margin-left:auto;flex:none;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center}
.pk-x svg{width:14px;height:14px}
.peek .play,.peek .btn{min-height:40px}
/* 精簡控制列 */
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.pill{flex:1 1 0;min-width:0;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:14px;font-weight:600;padding:0 28px 0 12px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
.pill.on{border-color:var(--pri);color:var(--pri)}
.qhead .qprog{flex:1;height:5px;border-radius:5px;background:var(--surface2);overflow:hidden;min-width:60px}
.qhead .qprog i{display:block;height:100%;background:var(--pri)}
.word-row{display:flex;align-items:center;justify-content:center;gap:10px}
.ex-row{display:flex;align-items:flex-start;gap:8px}
.ex-row .sent{flex:1;min-width:0}
.iplay{flex:none;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;margin-top:4px}
.iplay svg{width:18px;height:18px}
.setgrp{display:flex;flex-direction:column;gap:18px;padding:0 14px 16px}
.setgrp section{display:flex;flex-direction:column;gap:8px}
.setgrp section + section{border-top:1px solid var(--line);padding-top:14px}
.setgrp h4{margin:0;font-size:14px}
.furibtn ruby{font-family:var(--font-ja);font-size:17px;font-weight:600;line-height:1}
.furibtn rt{font-size:9px;color:inherit;visibility:visible!important}
.iconbtn.furibtn[aria-pressed="false"]{color:var(--muted)}
.iconbtn.furibtn[aria-pressed="false"] rt{text-decoration:line-through}
body.hide-furi rt{visibility:hidden}
body.hide-furi #gloss rt,body.hide-furi .furibtn rt{visibility:visible}
.authcard{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--pri-soft);border:1px solid var(--pri-mid);border-radius:14px;padding:12px 14px}
.authcard b{font-size:15px}
.gbtn-signin{gap:8px;white-space:nowrap;flex:none}
.gbtn-signin svg{background:#fff;border-radius:50%;padding:2px;width:22px;height:22px}
.en{color:var(--muted);font-weight:400;font-size:.88em}
/* 提示 */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.toast.goal{background:var(--pri);color:var(--pri-ink);font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.brand .full{display:none}}

/* ===== 按鈕：鍵帽質感（底部有一條較深的邊，按下去會往下沉） ===== */
.btn,.opt,.chip,.pill,.play,.iconbtn,.kc,.entry button,.seg{transition:transform .08s ease,box-shadow .08s ease,background-color .15s,border-color .15s}
.btn{box-shadow:0 3px 0 var(--pri-mid)}
.btn.solid{background:linear-gradient(180deg,color-mix(in srgb,var(--pri) 86%,#fff) 0%,var(--pri) 100%);border-color:var(--pri-deep);box-shadow:0 3px 0 var(--pri-deep),0 6px 14px -6px color-mix(in srgb,var(--pri) 55%,transparent)}
.btn.quiet{box-shadow:0 3px 0 var(--edge)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--pri-mid)}
.btn.solid:active:not(:disabled){box-shadow:0 1px 0 var(--pri-deep)}
.btn.quiet:active:not(:disabled){box-shadow:0 1px 0 var(--edge)}
.btn:disabled{box-shadow:none}
.opt{box-shadow:0 3px 0 var(--edge)}
.opt .k{background:var(--pri-soft);color:var(--pri)}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.opt.right{box-shadow:0 3px 0 var(--ok-deep)}
.opt.wrong{box-shadow:0 3px 0 var(--ng-deep)}
.chip,.pill,.play,.iconbtn,.kc,.entry button{box-shadow:0 2px 0 var(--edge)}
.chip[aria-pressed="true"],.iconbtn[aria-pressed="true"]{box-shadow:0 2px 0 var(--pri-deep)}
.kc.s2{box-shadow:0 2px 0 var(--pri-deep)}
.chip:active,.play:active,.iconbtn:active,.kc:active,.entry button:active{transform:translateY(2px);box-shadow:0 0 0 var(--edge)}
.entry button b{background:var(--surface);border-radius:999px;padding:0 9px;min-width:28px;text-align:center}
.entry button.zero b{background:none}
.seg button[aria-pressed="true"]{box-shadow:0 2px 0 var(--edge)}
@media (prefers-reduced-motion: reduce){.btn,.opt,.chip,.pill,.play,.iconbtn,.kc,.entry button{transition:none}.btn:active,.opt:active,.chip:active,.play:active,.iconbtn:active,.kc:active,.entry button:active{transform:none}}

/* ===== 按鈕配色：跟卡片、背景分開的填色（淺色、深色模式都有） ===== */
.btn.quiet,.pill,.iconbtn,.chip,.entry button,.kc,.opt{background-color:var(--btn);border-color:var(--btn-edge);color:var(--btn-ink);box-shadow:0 3px 0 var(--btn-edge)}
.iconbtn{color:var(--pri)}
.btn.quiet:active:not(:disabled),.opt:active:not(:disabled){box-shadow:0 1px 0 var(--btn-edge)}
.chip:active,.iconbtn:active,.kc:active,.entry button:active,.pill:active{box-shadow:0 1px 0 var(--btn-edge)}
.opt .k{background:var(--surface);color:var(--pri)}
.opt.right{background-color:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background-color:var(--ng-soft);border-color:var(--ng)}
.opt:disabled:not(.right):not(.wrong){opacity:.75}
.chip[aria-pressed="true"],.iconbtn[aria-pressed="true"]{background-color:var(--pri);border-color:var(--pri-deep);color:var(--pri-ink)}

.psent{font-size:24px;line-height:2.1;text-align:center}
.pblank{display:inline-block;min-width:2.4em;text-align:center;color:var(--pri);font-weight:700;border-bottom:2px solid var(--pri);margin:0 2px}

/* 拗音：練字格改成兩格並排，小字寫在格子左下；格子裡的兩個字靠近一點 */
.sqs{display:flex;gap:0}
.sqs.two .sq{width:76px;height:76px;font-size:52px}
.sqs.two .sq + .sq{border-left-width:0}
.sq .sm{font-size:.62em;transform:translate(-18%,14%)}
.kc .kk.kk2{letter-spacing:-.14em;margin-right:-.14em;font-feature-settings:"palt"}

/* 聽寫 */
.dict-play{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0 12px}
.dict-big{width:84px;height:84px;border-radius:999px;border:2px solid var(--fill-deep);background:linear-gradient(180deg,color-mix(in srgb,var(--fill) 85%,#fff),var(--fill));color:var(--fill-ink);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--fill-deep);transition:transform .08s,box-shadow .08s}
.dict-big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--fill-deep)}
.dict-big svg{width:38px;height:38px}
.hint.dict-hint{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px}
.linkbtn{border:0;background:none;color:var(--pri);font-weight:600;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.dict-mean{text-align:center;font-size:18px;font-weight:600;margin-top:8px}
/* 首次使用導覽 */
.tour-ring{position:fixed;z-index:70;border-radius:14px;box-shadow:0 0 0 3px var(--fill),0 0 0 9999px rgba(5,8,14,.55);pointer-events:none;transition:all .25s ease}
.tour-ring.none{left:50%!important;top:40%!important;width:0!important;height:0!important;box-shadow:0 0 0 9999px rgba(5,8,14,.55)}
.tour-card{position:fixed;z-index:71;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));max-width:480px;margin:0 auto;background:var(--surface);border:2px solid var(--frame);border-radius:16px;padding:16px 16px 14px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px}
.tour-card h3{margin:0;font-size:18px}
.tour-card p{margin:0;color:var(--muted);font-size:15px}
.tour-card .tour-step{font-size:13px;color:var(--muted)}
.tour-card .row{display:flex;gap:8px;align-items:center}
.tour-card .row .btn{flex:1}
.tour-dots{display:flex;gap:6px;justify-content:center}
.tour-dots i{width:7px;height:7px;border-radius:9px;background:var(--line)}
.tour-dots i.on{background:var(--fill);width:18px}
.tour-lang{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tour-art{display:block;width:100%;height:auto;max-height:110px}

/* 語言頁（義大利文、西班牙文、德文、俄文…）：沿用日文 App 的樣式（建置時從 ../index.html 抽出），這裡只補語言頁需要的部分 */
:root{--font-ja:var(--font-ui);--font-kana:var(--font-ui)}
[lang="it"],[lang="es"],[lang="de"],[lang="ru"],[lang="en"]{font-family:var(--font-ui)}
.brand b{font-family:var(--font-ui);font-weight:800}
.g-txt{font-family:var(--font-ui);font-weight:800}

/* 句子：歐洲語言不用振り仮名，行高縮小 */
.sent{font-family:var(--font-ui);font-size:20px;line-height:1.75}
.sent.sm{font-size:18px}
.tk{display:inline;border:0;background-color:transparent;color:inherit;font:inherit;padding:0 0 2px;margin:0 1px}
mark{display:inline;line-height:inherit;border-radius:4px;padding:0 .08em}
.prompt .big{font-family:var(--font-ui);font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.prompt .mid{font-size:22px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.opt .t{overflow-wrap:anywhere}
.fc .word{font-family:var(--font-ui);font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.fc .word .art{color:var(--muted);font-weight:500}
.fc .word.long,.prompt .big.long{font-size:clamp(26px,8vw,36px)}
.fc .word.xlong,.prompt .big.xlong{font-size:clamp(22px,6.6vw,30px)}
.fc .forms{text-align:center;color:var(--muted);font-size:15px}
.pos.m{color:var(--pri);border-color:var(--pri-mid)}
.pos.f{color:var(--ng);border-color:color-mix(in srgb,var(--ng) 45%,var(--line))}
.pos.n{color:var(--ok-deep,var(--ok));border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.st.wr{border-color:var(--ng);color:var(--ng)}
.blank{min-width:3em}

/* 字母表：沿用五十音的紙卡格子 */
.kc .rr{font-size:11px}
.kc.fo{opacity:.85}

/* 規則頁的例字：小的播放鍵 */
.say-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.say-chips .play{min-height:38px;padding:0 12px}
.say-chips .play em{font-style:normal;font-weight:500;color:var(--muted);font-size:13px}

/* 文法說明裡的表格 */
.gbody{font-size:16px;line-height:1.7}
.gbody p{margin:8px 0}
.gbody ul{margin:8px 0;padding-left:20px}
.gbody i{font-style:normal;color:var(--pri);font-weight:600}
.gbody table{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0;table-layout:fixed}
.gbody th,.gbody td{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.gbody th{background:var(--surface2);font-weight:600}
.gbody table.wide{table-layout:auto;font-size:13px}
.gbody table.wide th,.gbody table.wide td{white-space:nowrap;padding:5px 4px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}

/* 變化表 */
table.t{width:100%;border-collapse:collapse;font-size:16px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle;overflow-wrap:anywhere}
table.t th{font-size:13px;color:var(--muted);font-weight:600}
table.t td.p{color:var(--muted);width:28%;font-size:14px}
table.t td.f{font-weight:600}
/* 俄文的變化形不要在字中間斷行（нового），讓欄位自己變寬 */
table.t td.f[lang="ru"]{overflow-wrap:normal}
table.t td.a{width:44px;text-align:right}
table.t .iplay{width:36px;height:36px;margin:0}

/* 拉起式面板（點字看意思、單字詳細、字母）：外觀和下拉選單一樣 */
.sheet-body{overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:0 2px 6px;min-height:0}
.sheet-body .w1{font-size:28px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.an{padding:10px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.an:first-child{border-top:0}
.an .grow{flex:1;min-width:0}
.an .btn{min-height:40px;padding:0 12px;font-size:14px}
.rowx{display:flex;align-items:center;gap:10px}
.rowx .grow{flex:1;min-width:0}
.mean-big{font-size:20px;font-weight:700;margin:0}
.verdict.warn{color:var(--amb-ink)}
.hl-warn{background:var(--amb);border:1px solid var(--amb-edge);color:var(--amb-ink);border-radius:10px;padding:8px 12px;font-size:15px}
.zhs{color:var(--muted);font-size:15px}
.grow{flex:1;min-width:0}

.tk-top{padding:0 0 12px}
.tk-an{align-items:flex-start}
.tk-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tk-h b{font-size:18px}
.tk-m{margin:6px 0 10px}
.tk-ex{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--pri-soft)}
.tk-ex .grow{flex:1;min-width:0}
.an .tk-more{margin-top:10px;width:100%}

/* 名詞上方的性別小字（上方「名」按鈕開關，像日文頁的假名） */
ruby.gr{ruby-position:over}
rt.gt{font-family:var(--font-ui);font-size:.5em;font-weight:700;line-height:1;letter-spacing:0;user-select:none;-webkit-user-select:none}
rt.g-m{color:var(--pri)}
rt.g-f{color:var(--ng)}
rt.g-n{color:var(--ok-deep,var(--ok))}
rt.g-pl{color:var(--muted)}
body.hide-gen rt.gt{visibility:hidden}
body.hide-gen .sent{line-height:1.75}

/* 規則頁裡每個文法點的小標題 */
.gbody h3.gb-h{font-size:16px;font-weight:700;color:var(--pri);margin:18px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.gbody h3.gb-h:first-child{margin-top:0;padding-top:0;border-top:0}
/* 文法：範例拆解＋練習題 */
.gx-seg{margin:12px 0 4px}
.gx-cta{margin-top:14px;flex-wrap:wrap}
.gx-tip{margin:10px 0 2px}
.gx-ex{border-top:1px dashed var(--line);margin-top:14px;padding-top:14px;display:flex;flex-direction:column;gap:8px}
.gx-n{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.gx-gloss{display:flex;flex-wrap:wrap;gap:6px 6px;align-items:flex-end;background:var(--surface2);border-radius:12px;padding:10px}
.gx-w{display:flex;flex-direction:column;align-items:center;min-width:2.4em;padding:4px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.gx-w b{font-size:18px;font-weight:700;line-height:1.3}
.gx-w i{font-style:normal;font-size:13px;color:var(--muted);line-height:1.35;text-align:center}
.gx-p{font-size:18px;padding:4px 0;align-self:flex-start}
.gx-notes{margin:2px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.6}
.gx-fw{font-weight:700;color:inherit}
.gx-plain{display:flex;gap:10px;align-items:flex-start;background:var(--pri-soft);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.6}
.gx-plain>b{flex:none;font-size:12px;font-weight:800;background:var(--pri);color:#fff;border-radius:6px;padding:2px 6px;margin-top:2px}
.gx-go{margin-top:16px}
.gx-quiz{margin-top:10px}
.gx-quiz .qcard{box-shadow:none;border:0;padding:0;margin:0;background:none}
.gx-why{background:var(--surface2);border-radius:10px;padding:10px 12px;margin:8px 0 12px;display:flex;flex-direction:column;gap:4px}
.gx-why .sent{font-size:18px}
.gx-why p{margin:0;font-size:15px;line-height:1.6}
.gx-done{text-align:center;padding:16px 0 4px}
.gx-score{font-size:34px;font-weight:800}
.gx-done .btnrow{justify-content:center}
/* 文法關卡 */
.gr-view{margin:10px 0 4px}
.gp-top{display:flex;flex-direction:column;gap:8px}
.gp-top .meta{margin:0}
.gp-tt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.gp-tt b{font-size:18px}
.gp-tt span{color:var(--muted);font-size:14px}
.gp-bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.gp-bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.gp-all{margin:0;font-weight:700;color:var(--ok-deep,var(--ok))}
.gp-stage{margin:18px 0 0}
.gp-sh{display:flex;align-items:center;gap:10px;margin:0 2px 8px}
.gp-no{flex:none;width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;background:var(--pri);color:#fff}
.gp-no svg{width:18px;height:18px}
.gp-stage.done .gp-no{background:var(--ok)}
.gp-stage.locked .gp-no{background:var(--surface2);color:var(--muted)}
.gp-st{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.gp-st b{font-size:16px}
.gp-st span{font-size:13px;color:var(--muted);line-height:1.45}
.gp-cnt{flex:none;font-size:13px;font-weight:700;color:var(--muted)}
.gp-peek>summary{cursor:pointer;margin:0 2px 8px;font-size:13px;color:var(--muted);list-style-position:inside}
.gp-stage.locked .gp-row{opacity:.55}
.gp-row b{display:inline-flex;align-items:center;gap:6px}
.gp-ck{display:inline-flex;width:18px;height:18px;color:var(--ok-deep,var(--ok))}
.gp-ck svg{width:18px;height:18px}
.gp-row.now{box-shadow:inset 0 0 0 2px var(--pri)}
.gp-nowt{font-size:12px;font-weight:700;color:#fff;background:var(--pri);border-radius:6px;padding:1px 6px;margin-right:4px}
.gp-where{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 10px;margin:8px 0 0;font-size:13px;color:var(--muted)}
.gp-where p{flex-basis:100%;margin:4px 0 0;padding:8px 10px;border-radius:8px;background:var(--surface2);color:inherit;font-size:13px;line-height:1.5}
.gp-pass{display:inline-flex;align-items:center;gap:4px;color:var(--ok-deep,var(--ok))}
.gp-pass svg{width:15px;height:15px}
.gx-done .btnrow{grid-template-columns:1fr;max-width:340px;margin:0 auto}
.gp-row .gn .gp-nowt{color:#fff;background:var(--pri)}
.gp-stage .gp-row+.gp-row{margin-top:12px}
.gp-stage .gp-row{margin-bottom:0}
.gp-peek[open]>summary{margin-bottom:12px}
.gp-stage{margin-top:26px}
/* 動詞變化表（人稱 × 單複數） */
.gbody table.conj{table-layout:fixed;width:100%}
.gbody table.conj th{font-size:13px;color:var(--muted);font-weight:700;text-align:center;background:var(--surface2)}
.gbody table.conj td{padding:8px 10px}
.gbody table.conj .pn{display:block;font-size:13px;color:var(--muted);line-height:1.3}
.gbody table.conj .pn i{font-style:normal;margin-left:6px}
.gbody table.conj .vf{display:block;font-size:18px;font-weight:700;line-height:1.35}
.gbody table.conj .vf small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.gbody td .zg{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.gx-cta .btn{white-space:nowrap;padding-left:8px;padding-right:8px}
.gbody td:has(> .zg){white-space:nowrap;overflow-wrap:normal;word-break:keep-all}
.gbody table.conj .pn i{display:block;margin-left:0}
.gx-hint{margin:8px 0 4px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface2)}
.gx-hint>summary{cursor:pointer;font-size:14px;font-weight:700;color:inherit}
.gx-hint[open]>summary{margin-bottom:8px}
.gx-hint .gbody table{margin:6px 0}

      body: '<p>俄文的子句前面一定加<b>逗號</b>：</p>' + T2(['連接詞', '例子'], [['что（說…、…這件事）', 'Я знаю, что он прав.'], ['чтобы（為了）', 'Я учу русский, чтобы читать Толстого.'], ['если（如果）', 'Если будет хорошая погода, мы пойдём в парк.'], ['где、когда、как（間接問句）', 'Вы знаете, где метро?'], ['ли（是否）', 'Я не знаю, будет ли он дома.']]) +

    { id: 'where', tag: '句型', title: 'где、куда、откуда（在哪、去哪、從哪）', m: { re: w('где|куда|откуда|дома|домой|здесь|там|туда|сюда|отсюда') },
      body: '<p>俄文把「在哪裡」和「去哪裡」分得很清楚：</p>' + T2(['', '在哪裡 где?', '去哪裡 куда?', '從哪裡 откуда?'], [['疑問詞', 'где', 'куда', 'откуда'], ['這裡', 'здесь／тут', 'сюда', 'отсюда'], ['那裡', 'там', 'туда', 'оттуда'], ['家', 'дома', 'домой', 'из дома'], ['學校', 'в школе（前置格）', 'в школу（受格）', 'из школы（屬格）']]) },
    // ---- 名詞 ----
    { id: 'noun-gender', tag: '名詞', title: '名詞的性別：看字尾', m: { tok: 'softSign' },
      body: '<p>俄文名詞有三種性別，大多數看<b>最後一個字母</b>就知道：</p>' +
        T2(['性別', '字尾', '例子'], [['陽性', '子音、-й、（部分）-ь', 'стол、музей、словарь'], ['陰性', '-а、-я、（部分）-ь', 'книга、неделя、тетрадь'], ['中性', '-о、-е、-мя', 'окно、море、имя']]) +
        '<ul><li><b>-ь 結尾</b>的字可能是陽性，也可能是陰性，要背：<i>день</i>（陽）、<i>ночь</i>（陰）。</li><li>指男性的 -а、-я 名詞是陽性：<i>папа、дедушка、мужчина、дядя</i>。</li><li>外來語 -о、-е、-и 結尾的不變化：<i>кофе</i>（陽性）、<i>метро、такси、кафе</i>（中性）。</li></ul>' },
    { id: 'noun-plural', tag: '名詞', title: '名詞的複數', m: { tok: 'plural' },
      body: T2(['單數', '複數', '例子'], [['子音（陽）', '-ы', 'стол → столы'], ['-а（陰）', '-ы', 'мама → мамы'], ['-й、-ь、-я', '-и', 'музей → музеи、словарь → словари、неделя → недели、тетрадь → тетради'], ['-о（中）', '-а', 'окно → окна、место → места'], ['-е（中）', '-я', 'море → моря、здание → здания']]) +
        '<p><b>拼字規則</b>：г、к、х、ж、ш、щ、ч 後面不寫 ы，改寫 и：<i>книга → книги</i>、<i>урок → уроки</i>、<i>врач → врачи</i>。</p><p>常見的不規則複數：<i>друг → друзья、брат → братья、стул → стулья、человек → люди、ребёнок → дети、дом → дома、город → города、глаз → глаза</i>。</p>' },
    { id: 'spelling', tag: '名詞', title: '拼字規則：г к х ж ш щ ч 後面寫 и', m: { re: B + '[' + L + ']*[гкхжшщч]и[' + L + ']*' + E },
      body: '<p>俄文有一條拼字規則，名詞、形容詞、動詞都會用到：</p><ul><li>г、к、х、ж、ш、щ、ч 後面<b>不寫 ы，寫 и</b>：<i>книги、уроки、врачи、русский</i>。</li><li>ж、ш、щ、ч、ц 後面不寫 я、ю，寫 а、у：<i>учу、слышат</i>。</li><li>ж、ш、щ、ч、ц 後面沒重音的 о 寫成 е：<i>с мужем、хорошее、улицей</i>（比較：<i>с отцом、большое</i>）。</li></ul>' },
    { id: 'animate', tag: '名詞', title: '有生命名詞的受格', m: { tok: 'animAcc' },
      body: '<p>表示<b>人或動物</b>的名詞叫「有生命名詞」。它們的受格在兩種情況下跟<b>屬格一樣</b>：</p><ul><li>陽性單數：<i>Я вижу брата.</i>（看到哥哥）——比較：<i>Я вижу стол.</i>（看到桌子）</li><li>所有複數：<i>Я люблю собак.</i>、<i>Я жду друзей.</i>——比較：<i>Я люблю цветы.</i></li></ul><p>陰性單數（-а、-я）不受影響，照樣變 -у、-ю：<i>Я люблю маму.</i></p>',
      ex: [['Я вижу брата.', '我看到哥哥了。'], ['Я жду друзей.', '我在等朋友們。'], ['Я люблю собак.', '我喜歡狗。'], ['Мы встречаем гостей в аэропорту.', '我們去機場接客人。'], ['Ты знаешь этого человека?', '你認識這個人嗎？'], ['Я давно не видел отца.', '我很久沒見到父親了。']] },
    // ---- 格 ----
    { id: 'cases', tag: '格', title: '六個格是什麼', m: { tok: 'caseAll' },
      body: '<p>俄文名詞在句子裡扮演的角色不同，<b>字尾就會變</b>，這叫「格」。總共六個：</p>' +
        T2(['格', '問句', '主要用法'], [['主格 Им.', 'кто? что?', '主詞；字典裡的形'], ['屬格 Род.', 'кого? чего?', '「…的」；沒有（нет）；數量；у、из、без… 後面'], ['與格 Дат.', 'кому? чему?', '給誰；Мне нравится；к、по 後面'], ['受格 Вин.', 'кого? что?', '動作的對象；в／на 去哪裡'], ['工具格 Твор.', 'кем? чем?', '用什麼；和誰（с）；當…（職業）'], ['前置格 Пред.', 'о ком? о чём?', 'в／на 在哪裡；о 關於']]) +
        '<p class="tbl-cap">三個常見的變化（單數）：</p>' + T2(['', 'стол（陽）', 'книга（陰）', 'окно（中）'], [['主格', 'стол', 'книга', 'окно'], ['屬格', 'стола', 'книги', 'окна'], ['與格', 'столу', 'книге', 'окну'], ['受格', 'стол', 'книгу', 'окно'], ['工具格', 'столом', 'книгой', 'окном'], ['前置格', 'столе', 'книге', 'окне']]) },
    { id: 'prep-loc', tag: '格', title: 'в／на ＋ 前置格：在哪裡', m: { tok: 'locPrep' },
      body: '<p>回答 <b>Где?</b>（在哪裡）時，用 <b>в／на ＋ 前置格</b>。大多數名詞加 <b>-е</b>：</p>' +
        T2(['主格', '前置格'], [['парк', 'в парке'], ['школа', 'в школе'], ['окно', 'на окне'], ['музей', 'в музее'], ['Россия、тетрадь、здание', 'в России、в тетради、в здании（-и）']]) +
        '<ul><li><b>в</b>＝在…裡面：<i>в комнате、в городе、в сумке</i></li><li><b>на</b>＝在…上面；也用在活動、戶外空間、某些地方：<i>на столе、на работе、на почте、на улице、на концерте、на вокзале、на Тайване</i></li></ul><p>少數陽性名詞有特別的地點形 -у（重音在詞尾）：<i>в саду、на полу、в лесу、в аэропорту、в этом году</i>。</p>' },
    { id: 'prep-o', tag: '格', title: 'о ＋ 前置格：關於…', m: { tok: 'oPrep' },
      body: '<p><b>о</b>（母音前用 <b>об</b>）＝關於，後面接前置格：<i>Мы говорим о фильме.</i>、<i>Расскажи о себе.</i>、<i>книга об истории</i>。</p><p>口語也常說 <b>про ＋ 受格</b>：<i>фильм про любовь</i>。</p>',
      ex: [['Я думаю о тебе.', '我在想你。'], ['Он часто говорит о работе.', '他常常談工作。']] },
    { id: 'acc', tag: '格', title: '受格：動作的對象', m: { tok: 'accObj' },
      body: '<p>及物動詞後面的受詞用受格（Вин.）：</p>' +
        T2(['名詞', '主格', '受格'], [['陰性 -а', 'книга', 'Я читаю книгу.'], ['陰性 -я', 'неделя', 'Я был там неделю.'], ['陰性 -ь', 'тетрадь', 'Я взял тетрадь.（不變）'], ['陽性、中性（東西）', 'журнал、окно', 'Я читаю журнал.（不變）'], ['陽性（人、動物）', 'брат', 'Я жду брата.（＝屬格）']]) +
        '<p>重點：只有<b>陰性 -а／-я</b> 和<b>有生命的陽性</b>會變，其他跟主格一樣。</p>' },
    { id: 'acc-dir', tag: '格', title: 'в／на ＋ 受格：去哪裡', m: { tok: 'accDir' },
      body: '<p>回答 <b>Куда?</b>（去哪裡）時，用 <b>в／на ＋ 受格</b>：</p>' +
        T2(['在哪裡 Где?（前置格）', '去哪裡 Куда?（受格）'], [['Я в школе.', 'Я иду в школу.'], ['Я на работе.', 'Я иду на работу.'], ['Мы в Москве.', 'Мы едем в Москву.'], ['Я в театре.', 'Я иду в театр.']]) +
        '<p>原則：在哪裡用 в 的地方，去那裡也用 в；用 на 的也一樣。</p><p>去找<b>人</b>不用 в，用 <b>к ＋ 與格</b>：<i>Я иду к врачу.</i></p>' },
    { id: 'net', tag: '格', title: 'нет ＋ 屬格：沒有…', m: { re: w('нет [' + L + ']+') },
      body: '<p>說「沒有…、不在」用 <b>нет ＋ 屬格</b>：</p>' + T2(['有', '沒有'], [['У меня есть машина.', 'У меня нет машины.'], ['Здесь есть интернет.', 'Здесь нет интернета.'], ['У меня есть время.', 'У меня нет времени.']]) +
        '<p>過去式是 <b>не было</b>，將來是 <b>не будет</b>：<i>Вчера не было дождя.</i></p>' },
    { id: 'gen-of', tag: '格', title: '屬格：「…的」', m: { tok: 'genOf' },
      body: '<p>名詞後面接另一個名詞的屬格，表示「…的」：<i>столица <b>России</b></i>（俄羅斯的首都）、<i>центр <b>города</b></i>（市中心）、<i>номер <b>телефона</b></i>（電話號碼）。</p>' +
        T2(['主格', '屬格（單數）'], [['стол、музей、словарь', 'стола、музея、словаря'], ['книга', 'книги（г к х ж ш щ ч 後 -и）'], ['мама', 'мамы'], ['неделя、тетрадь', 'недели、тетради'], ['окно、море', 'окна、моря']]) +
        '<p>注意：中文是「俄羅斯的首都」，俄文的順序相反：<b>首都 ＋ 俄羅斯的</b>。</p>' },
    { id: 'gen-preps', tag: '格', title: '接屬格的介係詞', m: { re: w('из|от|до|без|для|после|около|кроме|напротив') },
      body: T2(['介係詞', '意思', '例子'], [['у', '在…那裡；（某人）有', 'у бабушки、У меня есть…'], ['из', '從…（裡面）', 'Я из Тайваня.'], ['от', '從…（人）', 'письмо от мамы'], ['до', '到…為止；…之前', 'до вечера、до урока'], ['без', '沒有…', 'кофе без сахара'], ['для', '為了；給…', 'подарок для тебя'], ['после', '…之後', 'после урока'], ['около', '在…附近', 'около банка'], ['кроме', '除了', 'кроме Ивана']]) },
    { id: 'quantity', tag: '格', title: 'много、мало、сколько ＋ 屬格', m: { re: w('(?:много|мало|немного|сколько) [' + L + ']+') },
      body: '<p>表示數量的字後面用屬格：可數的用<b>複數屬格</b>，不可數的用<b>單數屬格</b>。</p><p><i>много друзей</i>（很多朋友）、<i>много людей</i>、<i>мало времени</i>（時間不多）、<i>Сколько стоит?</i></p><p>複數屬格的形常常不規則：<i>друзья → друзей、книги → книг、люди → людей</i>。</p>' },
    { id: 'numbers', tag: '格', title: '數字後的名詞：1 книга、2 книги、5 книг', m: { tok: 'numNoun' },
      body: '<p>數字會決定後面名詞的格：</p>' + T2(['數字', '名詞', '例子'], [['1、21、31…', '單數主格', 'один брат、одна сестра'], ['2、3、4（22、23…）', '單數屬格', 'два брата、три урока、четыре человека'], ['5～20、25…', '複數屬格', 'пять рублей、десять минут、двадцать лет']]) +
        '<p>一和二會配合名詞的性別：<i>один стол、одна книга、одно окно</i>；<i>два стола、две книги</i>。</p><p>年紀：<i>один год、два года、пять лет</i>。</p>' },
    { id: 'dat', tag: '格', title: '與格：給誰', m: { tok: 'dat' },
      body: '<p>與格（Дат.）表示「給誰、對誰」：<i>Я звоню <b>маме</b>.</i>（打電話給媽媽）、<i>Я подарил <b>сестре</b> книгу.</i></p>' +
        T2(['主格', '與格'], [['брат、музей、словарь', 'брату、музею、словарю'], ['мама、неделя', 'маме、неделе'], ['тетрадь、Россия', 'тетради、России'], ['окно、море', 'окну、морю'], ['我、你、他、她', 'мне、тебе、ему、ей'], ['我們、你們、他們', 'нам、вам、им']]) +
        '<p>介係詞 <b>к</b>（往…那裡）和 <b>по</b>（沿著、在…範圍）接與格：<i>к врачу、по городу</i>。</p>' },
    { id: 'nravitsya', tag: '格', title: 'Мне нравится…（我喜歡…）', m: { re: w('нравится|нравятся|понравился|понравилась|понравилось|понравились') },
      body: '<p>нравиться 的意思是「讓人喜歡」：喜歡的<b>人用與格</b>，被喜歡的<b>東西是主詞</b>。</p>' + T2(['', '例子'], [['單數東西', 'Мне нравится этот город.'], ['複數東西', 'Мне нравятся эти туфли.'], ['過去式（配合東西的性別）', 'Мне понравился фильм.／Мне понравилась книга.']]) +
        '<p>跟 любить 比較：любить 比較強烈、長久（愛、很喜歡），нравиться 比較像「覺得不錯」。</p>',
      ex: [['Мне нравятся эти туфли.', '我喜歡這雙鞋。'], ['Тебе понравилась книга?', '你喜歡那本書嗎？']] },
    { id: 'impers', tag: '格', title: '無人稱句：Мне холодно', m: { re: w('холодно|тепло|жарко|скучно|интересно|вкусно|дорого|дешево|красиво') },
      body: '<p>描述天氣、感覺、評價時，俄文常用 <b>-о 結尾的字</b>，沒有主詞：<i>Сегодня холодно.</i>（今天很冷）。</p><p>要說「誰」覺得冷，就用<b>與格</b>：<i>Мне холодно.</i>（我覺得冷）、<i>Мне скучно.</i>（我覺得無聊）、<i>Тебе интересно?</i></p>' },
    { id: 'modal-pred', tag: '格', title: 'можно、нельзя、надо、нужно', m: { re: w('можно|нельзя|надо|нужно|пора') },
      body: T2(['字', '意思', '例子'], [['можно', '可以', 'Можно открыть окно?'], ['нельзя', '不可以', 'Здесь нельзя курить.'], ['надо／нужно', '需要、得', 'Мне надо купить хлеб.'], ['пора', '是時候了', 'Мне пора домой.']]) +
        '<p>「誰」要用<b>與格</b>：<i>Тебе нужно отдохнуть.</i>（你需要休息）。後面接動詞原形。</p>' },
    { id: 'age', tag: '格', title: '年齡的說法', m: { re: w('лет') + '|' + w('(?:один|двадцать один) год|(?:два|три|четыре) года') },
      body: '<p>年齡用<b>與格 ＋ 數字 ＋ год／года／лет</b>：</p><p><i>Мне двадцать лет.</i>（我二十歲）、<i>Брату три года.</i>、<i>Сколько тебе лет?</i>（你幾歲？）</p>' + T2(['數字', '說法'], [['1、21…', 'год'], ['2、3、4', 'года'], ['5～20、25…', 'лет']]),
      ex: [['Сколько тебе лет?', '你幾歲？'], ['Брату три года.', '弟弟三歲。']] },
    { id: 'ins-with', tag: '格', title: 'с ＋ 工具格：和…一起', m: { tok: 'insWith' },
      body: '<p><b>с</b>（某些子音組合前用 <b>со</b>）＋ 工具格＝和…一起、加了…：</p><p><i>Я иду в кино с подругой.</i>（和朋友）、<i>чай с молоком</i>（加牛奶的茶）、<i>Я гуляю с собакой.</i></p>' +
        T2(['主格', '工具格'], [['брат、словарь、музей', 'братом、словарём、музеем'], ['мама、неделя', 'мамой、неделей'], ['тетрадь', 'тетрадью'], ['окно、море', 'окном、морем'], ['我、你、他、她', 'мной、тобой、ним、ней'], ['我們、你們、他們', 'нами、вами、ними']]) +
        '<p>「我和你」俄文常說 <b>мы с тобой</b>。</p>' },
    { id: 'ins', tag: '格', title: '工具格：用…、當…', m: { tok: 'insBare' },
      body: '<ul><li>用什麼工具：<i>Я пишу <b>карандашом</b>.</i>、<i>Я ем суп <b>ложкой</b>.</i></li><li>職業、身分（работать、быть、стать 後面）：<i>Я работаю <b>программистом</b>.</i>、<i>Он хочет стать <b>инженером</b>.</i></li><li>某些動詞固定接工具格：<i>заниматься <b>спортом</b></i>、<i>интересоваться <b>историей</b></i>。</li></ul>' },
    // ---- 代名詞 ----
    { id: 'pron-cases', tag: '代名詞', title: '人稱代名詞的格', m: { tok: 'pronCase' },
      body: T2(['主格', '屬格／受格', '與格', '工具格', '前置格'], [['я', 'меня', 'мне', 'мной', 'мне'], ['ты', 'тебя', 'тебе', 'тобой', 'тебе'], ['он／оно', 'его', 'ему', 'им', 'нём'], ['она', 'её', 'ей', 'ей', 'ней'], ['мы', 'нас', 'нам', 'нами', 'нас'], ['вы', 'вас', 'вам', 'вами', 'вас'], ['они', 'их', 'им', 'ими', 'них']]) +
        '<p>他、她、他們在<b>介係詞後面</b>要加 н-：<i>у него、к ней、с ними、о них</i>。</p><p>常用說法：<i>Меня зовут…</i>（我叫…）、<i>Мне двадцать лет.</i>、<i>Я тебя люблю.</i></p>' },
    { id: 'poss', tag: '代名詞', title: '物主代名詞：мой、твой、наш、ваш', m: { re: w(formsOf('мой', 'твой', 'наш', 'ваш')) },
      body: '<p>「我的、你的、我們的、你們的」要配合後面名詞的<b>性別、單複數、格</b>：</p>' +
        T2(['', '陽性', '陰性', '中性', '複數'], [['我的', 'мой', 'моя', 'моё', 'мои'], ['你的', 'твой', 'твоя', 'твоё', 'твои'], ['我們的', 'наш', 'наша', 'наше', 'наши'], ['你們的、您的', 'ваш', 'ваша', 'ваше', 'ваши']]) +
        '<p><i>мой брат、моя сестра、моё письмо、мои друзья</i></p>' },
    { id: 'poss-inv', tag: '代名詞', title: 'его、её、их（他的、她的、他們的）', m: { tok: 'possInv' },
      body: '<p>「他的、她的、他們的」<b>不變化</b>，跟名詞是什麼性別、什麼格都沒關係：</p><p><i>его брат、его сестра、его друзья</i>；<i>Я знаю её брата.</i></p><p>注意：當「他的」時，介係詞後面<b>不加</b> н-：<i>у его брата</i>（在他哥哥那裡）。</p>' },
    { id: 'svoj', tag: '代名詞', title: 'свой：自己的', m: { re: w(formsOf('свой')) },
      body: '<p>所有者就是句子的主詞時，常用 <b>свой</b>（自己的）：<i>Он любит <b>свою</b> работу.</i>（他喜歡自己的工作）</p><p>比較：<i>Он любит <b>его</b> работу.</i>＝他喜歡（另一個人）的工作。</p>',
      ex: [['Она звонит своей маме.', '她打電話給自己的媽媽。']] },
    { id: 'etot', tag: '代名詞', title: 'этот、тот（這個、那個）', m: { re: w(formsOf('этот', 'тот')) },
      body: T2(['', '陽性', '陰性', '中性', '複數'], [['這個', 'этот', 'эта', 'это', 'эти'], ['那個', 'тот', 'та', 'то', 'те']]) +
        '<p><i>Этот фильм очень интересный.</i>、<i>Мне нравится эта картина.</i>、<i>в этом году</i>（今年）</p>' },
    { id: 'ves', tag: '代名詞', title: 'весь、всё、все（全部）', m: { re: w(formsOf('весь')) },
      body: T2(['陽性', '陰性', '中性', '複數'], [['весь день（整天）', 'вся семья（全家）', 'всё（一切）', 'все（大家）']]) +
        '<p><i>Всё хорошо.</i>（一切都好）、<i>Все пришли.</i>（大家都來了）。注意 всё 和 все 只差兩點，意思不同。</p>' },
    { id: 'kakoj', tag: '代名詞', title: 'какой、такой、который', m: { re: w(formsOf('какой', 'такой', 'который')) },
      body: '<p>這幾個字跟形容詞一樣變化：</p><ul><li><b>какой</b>＝什麼樣的、哪一個：<i>Какой твой любимый цвет?</i>；也用來感嘆：<i>Какая красивая девушка!</i></li><li><b>такой</b>＝這麼、這樣的：<i>Почему ты такой грустный?</i></li><li><b>который</b>＝哪一個；也當關係代名詞（…的那個）：<i>Который час?</i>（現在幾點）</li></ul>' },
    // ---- 形容詞 ----
    { id: 'adj-agree', tag: '形容詞', title: '形容詞配合名詞：новый、новая、новое、новые', m: { tok: 'adjNom' },
      body: T2(['', '陽性', '陰性', '中性', '複數'], [['一般', 'новый', 'новая', 'новое', 'новые'], ['重音在詞尾', 'молодой', 'молодая', 'молодое', 'молодые'], ['г к х 後', 'русский', 'русская', 'русское', 'русские'], ['ж ш щ ч 後', 'хороший', 'хорошая', 'хорошее', 'хорошие'], ['軟變化（-ний）', 'синий', 'синяя', 'синее', 'синие']]) +
        '<p><i>новый телефон、новая машина、новое платье、новые туфли</i></p>' },
    { id: 'adj-case', tag: '形容詞', title: '形容詞的格變化', m: { tok: 'adjCase' },
      body: '<p>形容詞也要跟著名詞變格：</p>' + T2(['', '陽性／中性', '陰性', '複數'], [['主格', 'новый／новое', 'новая', 'новые'], ['屬格', 'нового', 'новой', 'новых'], ['與格', 'новому', 'новой', 'новым'], ['受格', '同主格或屬格', 'новую', '同主格或屬格'], ['工具格', 'новым', 'новой', 'новыми'], ['前置格', 'новом', 'новой', 'новых']]) +
        '<p>-ого、-его 的 г 唸 [v]：<i>нового</i> 唸「諾瓦沃」。</p>' },
    { id: 'compar', tag: '形容詞', title: '比較級：больше、лучше', m: { tok: 'compar' },
      body: '<p>大多數形容詞加 <b>-ее</b>：<i>новый → новее、быстрый → быстрее、интересный → интереснее</i>。比較級不變化。</p>' + T2(['原級', '比較級'], [['хороший', 'лучше'], ['плохой', 'хуже'], ['большой', 'больше'], ['маленький', 'меньше'], ['дорогой', 'дороже'], ['дешёвый', 'дешевле'], ['молодой', 'моложе'], ['высокий', 'выше']]) +
        '<p>比較的對象用 <b>чем</b>：<i>Москва больше, чем Тайбэй.</i>。最高級用 <b>самый</b>：<i>самый большой город</i>。</p>',
      ex: [['Говорите громче, пожалуйста.', '請說大聲一點。'], ['Сегодня теплее, чем вчера.', '今天比昨天暖和。']] },
    { id: 'adverb', tag: '形容詞', title: '副詞：хорошо、быстро', m: { re: w('хорошо|плохо|быстро|медленно|громко|тихо|красиво|правильно') },
      body: '<p>形容詞把 -ый／-ий 換成 <b>-о</b> 就是副詞，用來修飾動詞：</p>' + T2(['形容詞', '副詞'], [['хороший（好的）', 'хорошо（好好地）'], ['быстрый', 'быстро'], ['громкий', 'громко'], ['красивый', 'красиво']]) +
        '<p><i>Ты хорошо поёшь!</i>（你唱得很好）——比較：<i>хорошая песня</i>（好聽的歌）</p>' },
    // ---- 動詞 ----
    { id: 'pres-1', tag: '動詞', title: '第一變位（-ешь、-ют）', m: { tok: 'pres1' },
      body: '<p>大多數 -ать、-ять 動詞是第一變位。去掉 -ть，加上：</p>' + T2(['人稱', '詞尾', 'читать'], [['я<span class="zg">我</span>', '-ю／-у', 'читаю'], ['ты<span class="zg">你</span>', '-ешь', 'читаешь'], ['он／она<span class="zg">他／她</span>', '-ет', 'читает'], ['мы<span class="zg">我們</span>', '-ем', 'читаем'], ['вы<span class="zg">你們／您</span>', '-ете', 'читаете'], ['они<span class="zg">他們</span>', '-ют／-ут', 'читают']]) +
        '<p>重音在詞尾時 е 寫成 <b>ё</b>：<i>живёшь、идёшь、пьёшь</i>。</p><p>有些動詞的詞幹會變，要背 я 和 ты 兩個形：<i>писать → пишу, пишешь</i>；<i>жить → живу, живёшь</i>。</p>' },
    { id: 'pres-2', tag: '動詞', title: '第二變位（-ишь、-ят）', m: { tok: 'pres2' },
      body: '<p>大多數 -ить 動詞，和一些 -еть、-ать 動詞是第二變位：</p>' + T2(['人稱', '詞尾', 'говорить'], [['я<span class="zg">我</span>', '-ю／-у', 'говорю'], ['ты<span class="zg">你</span>', '-ишь', 'говоришь'], ['он／она<span class="zg">他／她</span>', '-ит', 'говорит'], ['мы<span class="zg">我們</span>', '-им', 'говорим'], ['вы<span class="zg">你們／您</span>', '-ите', 'говорите'], ['они<span class="zg">他們</span>', '-ят／-ат', 'говорят']]) +
        '<p>ж、ш、ч、щ 後面寫 -у、-ат：<i>учу, учат</i>；<i>слышу, слышат</i>。</p><p>第二變位的 -еть、-ать 動詞要背：<i>смотреть、видеть、сидеть、слышать、лежать、спать、стоять</i>。</p>' },
    { id: 'mutation', tag: '動詞', title: '子音交替：люблю、хожу、пишу', m: { tok: 'mutation' },
      body: '<p>第二變位動詞的 <b>я 形</b>，詞幹最後的子音常常會變（其他人稱不變）：</p>' + T2(['變化', '例子'], [['б、п、в、м → бл、пл、вл、мл', 'любить → люблю、купить → куплю、готовить → готовлю'], ['д → ж', 'ходить → хожу、видеть → вижу、сидеть → сижу'], ['т → ч', 'платить → плачу、ответить → отвечу'], ['с → ш', 'просить → прошу、носить → ношу'], ['ст → щ', 'чистить → чищу']]) +
        '<p>第一變位的動詞如果會變，<b>每個人稱都變</b>：<i>писать → пишу, пишешь, пишут</i>；<i>сказать → скажу, скажешь</i>。</p>' },
    { id: 'refl', tag: '動詞', title: '-ся 動詞', m: { tok: 'refl' },
      body: '<p>-ся 結尾的動詞照一般變化，最後再加：母音後面 <b>-сь</b>，子音後面 <b>-ся</b>。</p>' + T2(['人稱', 'учиться', 'заниматься'], [['я', 'учусь', 'занимаюсь'], ['ты', 'учишься', 'занимаешься'], ['он／она', 'учится', 'занимается'], ['мы', 'учимся', 'занимаемся'], ['вы', 'учитесь', 'занимаетесь'], ['они', 'учатся', 'занимаются']]) +
        '<p>-тся、-ться 都唸「ㄘㄚ」[tsə]：<i>учится</i> 唸「烏奇擦」。</p><p>意思上常是「自己…」或「互相…」：<i>одеваться</i>（穿衣服）、<i>встречаться</i>（見面）。</p>' },
    { id: 'past', tag: '動詞', title: '過去式', m: { tok: 'past' },
      body: '<p>過去式很簡單：去掉 -ть，加上 <b>-л</b>。但要配合<b>主詞的性別和單複數</b>（不看人稱）：</p>' + T2(['主詞', '詞尾', 'читать'], [['он、я（男）、ты（男）', '-л', 'читал'], ['она、я（女）、ты（女）', '-ла', 'читала'], ['оно', '-ло', 'читало'], ['мы、вы、они', '-ли', 'читали']]) +
        '<p>所以女生說「我讀了」是 <i>Я читала</i>，男生說 <i>Я читал</i>。</p><p>不規則的要背：<i>идти → шёл, шла, шли</i>；<i>мочь → мог, могла</i>；<i>есть → ел, ела</i>。</p>' },
    { id: 'future', tag: '動詞', title: '將來式：буду ＋ 原形', m: { re: w('буду|будешь|будет|будем|будете|будут') },
      body: '<p>未完成體動詞的將來式：<b>быть 的將來形 ＋ 原形</b>。</p>' + T2(['人稱', 'быть', '例子'], [['я', 'буду', 'Я буду читать.'], ['ты', 'будешь', 'Ты будешь работать?'], ['он／она', 'будет', 'Завтра будет дождь.'], ['мы', 'будем', 'Мы будем дома.'], ['вы', 'будете', 'Что вы будете пить?'], ['они', 'будут', 'Они будут учиться.']]) +
        '<p>完成體動詞不這樣說：它的「現在式變化」本身就是將來（見「體」）。</p>',
      ex: [['Что вы будете пить?', '您要喝什麼？']] },
    { id: 'aspect', tag: '動詞', title: '體：未完成體和完成體', m: { tok: 'aspect' },
      body: '<p>俄文動詞大多成對：<b>未完成體</b>說過程、習慣、反覆；<b>完成體</b>說一次做完、有結果。</p>' + T2(['未完成體', '完成體', '意思'], [['читать', 'прочитать', '讀'], ['делать', 'сделать', '做'], ['писать', 'написать', '寫'], ['покупать', 'купить', '買'], ['говорить', 'сказать', '說'], ['давать', 'дать', '給']]) +
        '<p><i>Вчера я <b>читал</b> книгу.</i>（昨天在讀書——過程）<br><i>Вчера я <b>прочитал</b> книгу.</i>（昨天把書讀完了——結果）</p><p>完成體<b>沒有現在式</b>：<i>Я прочитаю</i>＝我會讀完（將來）。</p>' },
    { id: 'motion', tag: '動詞', title: '運動動詞：идти／ходить、ехать／ездить', m: { tok: 'motion' },
      body: '<p>「去」要分<b>走路</b>還是<b>搭交通工具</b>，還要分<b>單向</b>還是<b>來回、經常</b>：</p>' + T2(['', '單向、正在去', '來回、經常'], [['走路', 'идти（иду, идёшь）', 'ходить（хожу, ходишь）'], ['搭車', 'ехать（еду, едешь）', 'ездить（езжу, ездишь）'], ['飛', 'лететь（лечу）', 'летать（летаю）']]) +
        '<p><i>Сейчас я <b>иду</b> в школу.</i>（我現在正要去學校）<br><i>Каждый день я <b>хожу</b> в школу.</i>（我每天去學校）<br><i>Вчера я <b>ходил</b> в музей.</i>（昨天去了博物館，已經回來）</p>' },
    { id: 'imp', tag: '動詞', title: '命令式', m: { tok: 'imp' },
      body: '<p>從 они 的形去掉詞尾：</p><ul><li>剩下母音結尾 → 加 <b>-й</b>：<i>читают → читай</i></li><li>子音結尾 → 加 <b>-и</b>：<i>говорят → говори</i>、<i>пишут → пиши</i></li></ul><p>對「您」或很多人，再加 <b>-те</b>：<i>читайте、говорите</i>。-ся 動詞：<i>садись、садитесь</i>。</p><p>不規則：<i>есть → ешь、дать → дай、быть → будь、встать → встань</i>。</p>' },
    { id: 'davaj', tag: '動詞', title: 'Давай(те)…（我們…吧）', m: { re: w('давай|давайте') },
      body: '<p><b>давай</b>（對很多人或客氣時用 <b>давайте</b>）＋ 完成體的 мы 形＝「我們…吧」：<i>Давай поедем на море!</i>、<i>Давайте посмотрим этот фильм.</i></p><p>後面也可以接未完成體原形：<i>Давай ужинать!</i></p>' },
    { id: 'modal', tag: '動詞', title: 'хотеть、мочь、уметь ＋ 原形', m: { re: w(formsOf('хотеть', 'мочь', 'уметь')) },
      body: T2(['動詞', '意思', '例子'], [['хотеть', '想要', 'Я хочу пить.'], ['мочь', '能、可以（有條件、被允許）', 'Ты можешь мне помочь?'], ['уметь', '會（學過的技能）', 'Ты умеешь плавать?']]) +
        '<p>хотеть 是混合變化：<i>хочу, хочешь, хочет, хотим, хотите, хотят</i>。</p>' },
    // ---- 時間 ----
    { id: 'clock', tag: '時間', title: '幾點：в семь часов', m: { re: w('(?:в|во) (?:сколько|один|два|три|четыре|пять|шесть|семь|восемь|девять|десять|одиннадцать|двенадцать)(?: час(?:а|ов)?)?|который час') },
      body: '<p>「在幾點」用 <b>в ＋ 數字 ＋ час／часа／часов</b>：</p>' + T2(['數字', '說法'], [['1', 'в час'], ['2、3、4', 'в два часа'], ['5～12', 'в семь часов']]) +
        '<p>問「幾點？」：<i>Который час?</i>（現在幾點）、<i>Во сколько?</i>（在幾點）。口語常省略 часов：<i>в семь</i>。</p>' },
    { id: 'days', tag: '時間', title: '星期幾：в понедельник', m: { re: w('(?:в|во) (?:понедельник|вторник|среду|четверг|пятницу|субботу|воскресенье)|на выходных|в выходные|на прошлой неделе') },
      body: '<p>「在星期幾」用 <b>в ＋ 受格</b>：</p>' + T2(['星期', '在那天'], [['понедельник', 'в понедельник'], ['вторник', 'во вторник'], ['среда', 'в среду'], ['четверг', 'в четверг'], ['пятница', 'в пятницу'], ['суббота', 'в субботу'], ['воскресенье', 'в воскресенье']]) +
        '<p>週末：<i>на выходных</i>。每週六：<i>по субботам</i>（по ＋ 複數與格）。</p>' },
    { id: 'months', tag: '時間', title: '月份與季節：в мае、летом', m: { re: w('в (?:январе|феврале|марте|апреле|мае|июне|июле|августе|сентябре|октябре|ноябре|декабре)|зимой|весной|летом|осенью') },
      body: '<p>月份用 <b>в ＋ 前置格</b>：<i>в январе、в мае、в сентябре</i>。</p><p>季節直接用<b>工具格</b>，不加介係詞：<i>зимой</i>（冬天）、<i>весной</i>（春天）、<i>летом</i>（夏天）、<i>осенью</i>（秋天）。早上、晚上也一樣：<i>утром、днём、вечером、ночью</i>。</p><p>日期用序數詞中性：<i>Сегодня третье мая.</i>（今天五月三日）</p>' },
    // ---- 日常 ----
    { id: 'greet', tag: '日常', title: '打招呼與自我介紹', m: { re: w('здравствуйте|привет|меня зовут|как тебя зовут|как вас зовут|очень приятно|до свидания|пока|доброе утро|добрый день|добрый вечер') },
      body: T2(['說法', '場合'], [['Здравствуйте!', '您好（正式；對很多人）'], ['Привет!', '嗨（朋友之間）'], ['Доброе утро／Добрый день／Добрый вечер', '早安／午安／晚上好'], ['Меня зовут…', '我叫…'], ['Как тебя зовут?／Как вас зовут?', '你叫什麼名字？'], ['Очень приятно.', '很高興認識你'], ['До свидания!／Пока!', '再見／掰掰']]) +
        '<p>здравствуйте 的第一個 в 不發音：唸「茲德拉斯特烏伊捷」。</p><p>對長輩、陌生人用 <b>вы</b>（您），對朋友、家人、小孩用 <b>ты</b>。</p>' },
    { id: 'polite', tag: '日常', title: 'спасибо、пожалуйста、извините', m: { re: w('спасибо|пожалуйста|извините|простите|не за что') },
      body: T2(['說法', '意思'], [['Спасибо!／Большое спасибо!', '謝謝／非常感謝'], ['Пожалуйста.', '請；不客氣'], ['Не за что.', '不客氣'], ['Извините／Простите', '不好意思；對不起']]) +

// 字卡順序：常用語先，再讓名詞、動詞、形容詞、其他輪流出現
const ORDER = (() => {
  const g = { expr: [], n: [], v: [], adj: [], o: [] };
  WORDS.forEach(w => (w.pos === 'expr' ? g.expr : g[w.pg]).push(w));
  const out = g.expr.slice(), lists = [g.n, g.v, g.adj, g.o, g.n, g.v], idx = lists.map(() => 0), used = new Set();
  let added = true;
  while (added) {
    added = false;
    lists.forEach((L, i) => {
      while (idx[i] < L.length && used.has(L[idx[i]].id)) idx[i]++;
      if (idx[i] < L.length) { const w = L[idx[i]++]; used.add(w.id); out.push(w); added = true; }
    });
  }
  return out;
})();

function touch(id, patch) {

// ================= 語音（日文頁和語言頁共用：n5src/shared/voice.js） =================
// build.js 會把這個檔複製進兩邊的頁面（見 lib-tab.js 開頭的說明）。
// 用瀏覽器內建的語音（speechSynthesis）念單字和句子。各語言怎麼挑聲音由 PAGE.voice 提供：
//   GOOD 比較自然的語音名稱、match(v) 這個語言的語音、score(v) 越高越好、robotic(v) 聽起來很機械（可省略）、
//   saved()／save(uri) 使用者選的語音、text(t) 念之前整理文字（可省略）、uLang(v) 要念的語言代碼、
//   label 設定裡的標題、none 沒有語音時的說明、help(opts) 語音不好時的建議、note 設定說明、sample 試聽的句子
const Voice = {
  list: [], ok: 'speechSynthesis' in window,
  get GOOD() { return PAGE.voice.GOOD; },
  score(v) { return PAGE.voice.score(v); },
  refresh() { if (!this.ok) return; try { this.list = speechSynthesis.getVoices().filter(v => PAGE.voice.match(v)); } catch (e) { this.list = []; } },
  init() {
    if (!this.ok) return;
    const load = () => { this.refresh(); if (UI.tab === 'lib') renderVoiceBox(); };
    load();
    try { speechSynthesis.addEventListener('voiceschanged', load); } catch (e) { speechSynthesis.onvoiceschanged = load; }
  },
  best() {
    if (!this.list.length) this.refresh();
    const saved = PAGE.voice.saved();
    if (saved) { const v = this.list.find(x => x.voiceURI === saved || x.name === saved); if (v) return v; }
    return this.list.slice().sort((a, b) => this.score(b) - this.score(a))[0] || null;
  },
  allRobotic() { const R = PAGE.voice.robotic; return !!R && this.list.length > 0 && this.list.every(R); },
  // voiceOverride：指定用哪個聲音；rate：指定速度（例如慢速播放），沒給就用設定
  speak(text, voiceOverride, rate) {
    if (!this.ok || !text) { if (!this.ok) toast('這個瀏覽器不支援語音播放'); return; }
    const P = PAGE.voice;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(P.text ? P.text(text) : text);
      const v = voiceOverride || this.best();
      if (v) u.voice = v;
      u.lang = P.uLang(v);
      u.rate = rate || Number(SET.rate) || 0.9;
      speechSynthesis.speak(u);
    } catch (e) { toast('無法播放聲音'); }
  }
};
// 設定裡的「發音」區：選語音、速度、試聽
function renderVoiceBox() {
  const P = PAGE.voice;
  const box = $('#voiceBox'); if (!box) return;
  if (!Voice.ok) { box.innerHTML = '<div class="warn">這個瀏覽器不支援語音播放。建議改用 Safari、Chrome 或 Edge。</div>'; return; }
  Voice.refresh();
  const best = Voice.best();
  const opts = Voice.list.slice().sort((a, b) => Voice.score(b) - Voice.score(a));
  box.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">
    <label class="label" for="vsel">${P.label}</label>
    ${opts.length ? `<select id="vsel">${opts.map(v => `<option value="${esc(v.voiceURI)}"${best && v.voiceURI === best.voiceURI ? ' selected' : ''}>${esc(v.name)}${Voice.GOOD.test(v.name) ? '（較自然）' : ''}</option>`).join('')}</select>` : `<div class="meta">${P.none}</div>`}
    <div class="range"><label class="label" for="vrate">速度</label><input id="vrate" type="range" min="0.6" max="1.2" step="0.1" value="${SET.rate}"><span class="meta" id="vrateV">${Number(SET.rate).toFixed(1)} 倍</span></div>
    <div class="row"><button class="play" id="vtest">${ICON.play}試聽</button></div>
    ${P.help(opts)}
    <div class="meta">${P.note}</div>
  </div>`;
  const sel = $('#vsel');
  if (sel) sel.onchange = () => P.save(sel.value);
  const rate = $('#vrate');
  rate.oninput = () => { SET.rate = Number(rate.value); $('#vrateV').textContent = SET.rate.toFixed(1) + ' 倍'; saveSet(); };
  $('#vtest').onclick = () => Voice.speak(P.sample);
}

// 名詞上方的性別小字（像日文的假名，可以在上方按鈕開關）
// 只在這個字一定是名詞、而且性別只有一種時才標；例句裡同形的其他詞性（德文 Sie、俄文 дома）不標
const GCACHE = new Map();
function genOfToken(form) {
  const k = IT.norm(form).toLowerCase();
  if (GCACHE.has(k)) return GCACHE.get(k);
  let g = null;
  const inf = (LOOK.get(k) || []).filter(x => !/的一部分/.test(x.desc || ''));
  if (inf.length && inf.every(x => x.idx >= 0 && IT.W[x.idx][1] === 'n')) {
    const gs = new Set(inf.map(x => IT.W[x.idx][2]));
    if (gs.size === 1) { const one = [...gs][0]; if (GEN[one]) g = one; }
  }
  if (g && LC.id === 'de' && !/^[A-ZÄÖÜ]/.test(form)) g = null; // 德文名詞一定大寫
  GCACHE.set(k, g);
  return g;
}
const genOn = () => SET.gender !== false;
function applyGen() {
  document.body.classList.toggle('hide-gen', !genOn());
  const b = $('#genBtn'); if (!b) return;

// 句子：每個字都能點；ranges 是要標黃的範圍；blank 是挖空的位置；noGen 不標性別（考性別、格的題目）
function sentHTML(s, o = {}) {
  const ranges = o.ranges || [];
  const inR = i => ranges.some(r => i >= r[0] && i < r[1]);
  let pos = 0, out = '';
  for (const t of IT.tokenize(s)) {
    const start = pos; pos += t.t.length;
    if (o.blank && start === o.blank[0]) { out += o.blankHTML; continue; }
    if (o.blank && start > o.blank[0] && start < o.blank[1]) continue;
    if (!t.w) { out += esc(t.t); continue; }
    let tk = `<span class="tk" role="button" tabindex="0" data-w="${esc(t.t)}">${esc(t.t)}</span>`;
    const g = o.noGen ? null : genOfToken(t.t);
    if (g) tk = `<ruby class="gr">${tk}<rt class="gt g-${g}" aria-hidden="true">${esc(GEN[g][1])}</rt></ruby>`;
    out += inR(start) ? `<mark>${tk}</mark>` : tk;
  }
  return out;
}

const Sheet = {
  el: null, back: null, prev: null,
  build() {
    this.back = document.createElement('div'); this.back.className = 'pk-back'; this.back.hidden = true;
    this.el = document.createElement('div'); this.el.className = 'pk'; this.el.hidden = true;
    this.el.setAttribute('role', 'dialog'); this.el.setAttribute('aria-modal', 'true');
    document.body.append(this.back, this.el);
    this.back.onclick = () => this.close();
    this.el.addEventListener('click', e => { if (e.target.closest('.pk-x')) this.close(); });
  },
  open(title, body, label) {
    if (!this.el) this.build();
    if (this.el.hidden) this.prev = document.activeElement;
    this.el.setAttribute('aria-label', label || title.replace(/<[^>]+>/g, ''));
    this.el.innerHTML = `<div class="pk-grab" aria-hidden="true"></div><div class="pk-top"><b>${title}</b><button class="pk-x" aria-label="關閉">${ICON.ng}</button></div><div class="sheet-body">${body}</div>`;
    this.back.hidden = false; this.el.hidden = false;
    requestAnimationFrame(() => { this.back.classList.add('in'); this.el.classList.add('in'); $('.pk-x', this.el).focus({ preventScroll: true }); });
    return this.el;
  },
  close() {
    if (!this.el || this.el.hidden) return;
    this.back.classList.remove('in'); this.el.classList.remove('in');
    setTimeout(() => { this.back.hidden = true; this.el.hidden = true; }, 180);
    if (this.prev && document.contains(this.prev)) try { this.prev.focus({ preventScroll: true }); } catch (e) {}
  },
  isOpen() { return this.el && !this.el.hidden; }
};
document.addEventListener('keydown', e => { if (e.key === 'Escape' && Sheet.isOpen()) { e.stopPropagation(); Sheet.close(); } }, true);

  if (nm) body += `<div class="an"><div class="grow"><b lang="${LC.id}">${esc(nm[0])}</b><div class="meta">${esc(nm[1])}</div></div></div>`;
  const seen = new Set();
  for (const x of infos) {
    const key = x.lemma + '|' + x.desc; if (seen.has(key)) continue; seen.add(key);
    const e = x.idx >= 0 ? IT.W[x.idx] : null;
    if (e) {
      const w = WMAP[idOfEntry(e)];
      body += `<div class="an tk-an"><div class="grow"><div class="tk-h"><b lang="${LC.id}">${esc(w.title)}</b><span class="pos">${esc(POS_ZH[w.pos])}</span></div>${x.desc ? `<div class="meta">${esc(x.desc)}</div>` : ''}<p class="mean-big tk-m">${meanW(w)}</p>

function conjTable(w, which) {

  else if (which === 'pass') { const PP = LC.pastPersons || P, SP = LC.sayPast || LC.sayPerson; rows = c.passato.map((f, i) => [PP[i], f, SP(i) + ' ' + f.split('/')[0]]); }
  else rows = c.imperative ? c.imperative.map((f, i) => [LC.impPersons[i], f, f.split('/')[0]]).filter(r => r[1]) : [];
  if (!rows.length) return `<p class="meta">${which === 'pass' ? '這個動詞通常不用完成式。' : '這個動詞沒有常用的命令式。'}</p>`;
  return `<table class="t"><tbody>${rows.map(([p, f, say]) => `<tr><td class="p">${esc(p)}</td><td class="f" lang="${LC.id}">${esc(f)}</td><td class="a">${iconPlay(say, '播放 ' + f)}</td></tr>`).join('')}</tbody></table>`;
}

// 文法列表、變化規則頁、範例拆解（gxExamplesHTML）各頁自己畫。各頁不同的地方由 PAGE.gram 提供：
//   prefix 過關紀錄 id 的前綴（日文 'ja:gx:'、語言頁 'it:gx:'…）、path 關卡 [[名稱, 說明, [文法id…]]…]（沒有就不分關）、

const ICON_LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const gxKey = id => PAGE.gram.prefix + id;

const gxPassed = id => !!(S.items[gxKey(id)] || {}).p;
function gxStages() {
  let prevDone = true;
  return (PAGE.gram.path || []).map(([title, desc, ids], i) => {
    const done = ids.filter(gxPassed).length;
    const st = done === ids.length ? 'done' : prevDone ? 'open' : 'locked';
    prevDone = prevDone && done === ids.length;
    return { i, title, desc, ids, done, st };

}
const gxStageOf = id => gxStages().find(x => x.ids.includes(id));
function gxNext(after) {

}
function gxRecord(id, right, total) {
  reloadShared();

  if (old.p || right >= gxNeed(total)) r.p = 1;

}
function gxPathHTML() {
  const T = PAGE.gram.title;

      <p class="meta">照順序學，後面的文法會用到前面的。每個文法點看完說明和範例，練習題答對八成就過關（6 題要對 5 題）；一關全部過關，下一關就會打開。</p>

function gxWhere(id) {

// 練習題：四選一，答完一定顯示整句和「為什麼」，不自動跳下一題；算進今日題數，不進錯題和複習
function startGxQuiz(box, gx, id) {
  if (!box) return;
  const P = PAGE.gram;
  const qs = shuffle(gx.q); let i = 0, right = 0;
  const next = () => {
    if (!box.isConnected) return;
    if (i >= qs.length) {
      const all = right >= gxNeed(qs.length), perfect = right === qs.length;
      let nx = '', nt = '';
      if (id && P.path) {
        const before = gxStageOf(id);
        gxRecord(id, right, qs.length);
        const after = gxStageOf(id);
        if (before && after && before.st !== 'done' && after.st === 'done') toast(`第 ${after.i + 1} 關完成！${P.path[after.i + 1] ? `第 ${after.i + 2} 關打開了` : '全部關卡都過了'}`, true);
        nx = gxNext(id); nt = nx ? P.title(nx) : '';
      }
      const msg = all ? (perfect ? '全對，' : '') + (P.path ? '過關！' : '這個文法你會了。') : (P.path ? `答對 ${gxNeed(qs.length)} 題才算過關。` : '') + (right ? '差一點，看一下範例再練一次。' : '先看範例拆解，再回來試試。');
      box.innerHTML = `<div class="gx-done"><div class="gx-score">${right} / ${qs.length}</div><p>${msg}</p><div class="btnrow">${all && nx ? `<button class="btn solid" data-gram="${nx}">下一個：${esc(nt)}</button><button class="btn quiet" id="gxAgain">再練一次</button>` : `<button class="btn solid" id="gxAgain">再練一次</button><button class="btn quiet" data-gpane="ex">看範例</button>`}</div></div>`;
      $('#gxAgain', box).onclick = () => startGxQuiz(box, gx, id);
      $$('[data-gpane]', box).forEach(b => b.onclick = () => { gramPane = b.dataset.gpane; renderGram(); });
      const wh = $('.gp-where', box.closest('.card')); if (wh) wh.outerHTML = gxWhere(id);
      return;
    }
    const q = P.quizQ(qs[i++], id);
    renderChoice(box, {
      head: `<div class="qhead"><span class="meta">文法練習 ${i} / ${qs.length}</span></div>${q.head || ''}`,
      promptHTML: q.prompt,
      options: q.options,
      onAnswer: ok => { if (ok) right++; bumpDay(); const b = $('#blank', box); if (b) { b.textContent = q.ans; b.classList.add(ok ? 'ok' : 'ng'); } },
      explain: q.explain,

}

  const c = { total: WORDS.length, learned: 0, queued: 0, excluded: 0, due: 0, dueAll: 0, mcW: 0, mcR: 0, fillW: 0, fillR: 0, recent: 0 };
  for (const w of WORDS) {
    const r = getRec(w.id);
    if (r.s === 'learned') { c.learned++; if (r.due && r.due <= t) c.dueAll++; }
    if (r.s === 'queued') c.queued++;
    if (r.s === 'excluded') c.excluded++;
    if (rset.has(w.id)) c.recent++;

    if (ww.fill === 1) c.fillW++; if (ww.fill === 2) c.fillR++;

  c.due = dueToday().size;
